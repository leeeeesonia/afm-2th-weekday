<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; }
    body { background-color: #fafaf9; }
    .fade-in { animation: fade 0.2s ease-in; }
    @keyframes fade { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ========================================
    // Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, children, className = '', type = 'button' }) {
      const base = 'inline-flex items-center justify-center font-normal transition-colors duration-150 focus:outline-none disabled:opacity-40 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-neutral-900 text-neutral-50 hover:bg-neutral-700',
        secondary: 'bg-transparent text-neutral-700 hover:text-neutral-900',
        danger: 'bg-transparent text-neutral-400 hover:text-neutral-900',
        ghost: 'bg-transparent text-neutral-500 hover:text-neutral-900',
      };
      const sizes = {
        sm: 'px-2 py-1 text-xs',
        md: 'px-4 py-2 text-sm',
        lg: 'px-6 py-3 text-base',
      };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Input({ type = 'text', value, onChange, placeholder, disabled = false, className = '', onKeyDown, autoFocus = false }) {
      return (
        <input
          type={type}
          value={value}
          onChange={onChange}
          onKeyDown={onKeyDown}
          placeholder={placeholder}
          disabled={disabled}
          autoFocus={autoFocus}
          className={`w-full bg-transparent border-b border-neutral-200 px-1 py-3 text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-neutral-900 transition-colors ${className}`}
        />
      );
    }

    function Checkbox({ checked, onChange, ariaLabel }) {
      return (
        <button
          type="button"
          role="checkbox"
          aria-checked={checked}
          aria-label={ariaLabel}
          onClick={onChange}
          className={`w-5 h-5 rounded-full border flex items-center justify-center transition-colors shrink-0 ${
            checked
              ? 'bg-neutral-900 border-neutral-900'
              : 'bg-transparent border-neutral-300 hover:border-neutral-500'
          }`}
        >
          {checked && (
            <svg className="w-3 h-3 text-neutral-50" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
            </svg>
          )}
        </button>
      );
    }

    // ========================================
    // Auth storage + API Client
    // ========================================

    const TOKEN_KEY = 'todo_app_01:token';
    const tokenStore = {
      get: () => { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } },
      set: (t) => { try { localStorage.setItem(TOKEN_KEY, t); } catch {} },
      clear: () => { try { localStorage.removeItem(TOKEN_KEY); } catch {} },
    };

    const API_BASE_URL = '/api';

    class AuthError extends Error {
      constructor(message) { super(message); this.name = 'AuthError'; }
    }

    async function apiRequest(path, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      const token = tokenStore.get();
      if (token) headers['Authorization'] = `Bearer ${token}`;

      const res = await fetch(`${API_BASE_URL}${path}`, { ...options, headers });

      if (res.status === 401) {
        let msg = '인증이 필요합니다.';
        try { const body = await res.json(); if (body && body.message) msg = body.message; } catch {}
        throw new AuthError(msg);
      }

      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try { const body = await res.json(); if (body && body.message) msg = body.message; } catch {}
        throw new Error(msg);
      }

      if (res.status === 204) return null;
      return res.json();
    }

    const api = {
      signup: (email, password, name) => apiRequest('/auth/signup', { method: 'POST', body: JSON.stringify({ email, password, name }) }),
      login: (email, password) => apiRequest('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) }),
      me: () => apiRequest('/auth/me'),
      list: () => apiRequest('/todos'),
      create: (text) => apiRequest('/todos', { method: 'POST', body: JSON.stringify({ text }) }),
      update: (id, patch) => apiRequest(`/todos/${id}`, { method: 'PATCH', body: JSON.stringify(patch) }),
      remove: (id) => apiRequest(`/todos/${id}`, { method: 'DELETE' }),
      clearCompleted: () => apiRequest('/todos?completed=true', { method: 'DELETE' }),
    };

    // ========================================
    // Auth screen
    // ========================================

    function AuthScreen({ onAuthed }) {
      const [mode, setMode] = useState('login'); // 'login' | 'signup'
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [error, setError] = useState(null);
      const [submitting, setSubmitting] = useState(false);

      const submit = async () => {
        if (submitting) return;
        setError(null);
        setSubmitting(true);
        try {
          const result = mode === 'signup'
            ? await api.signup(email.trim(), password, name.trim() || undefined)
            : await api.login(email.trim(), password);
          if (!result || !result.token) throw new Error('응답에 토큰이 없습니다.');
          tokenStore.set(result.token);
          onAuthed(result.user);
        } catch (e) {
          setError(e.message || '요청에 실패했습니다.');
        } finally {
          setSubmitting(false);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          submit();
        }
      };

      return (
        <main className="min-h-screen w-full flex justify-center px-4 sm:px-6 py-16 sm:py-24">
          <div className="w-full max-w-sm">
            <header className="mb-12 text-center">
              <h1 className="text-4xl font-extralight tracking-widest text-neutral-900 uppercase">
                할 일
              </h1>
              <p className="mt-2 text-sm text-neutral-400 font-light">
                계정으로 시작하세요
              </p>
            </header>

            <div className="flex items-center gap-6 mb-8 justify-center">
              {[
                { key: 'login', label: '로그인' },
                { key: 'signup', label: '회원가입' },
              ].map(t => (
                <button
                  key={t.key}
                  type="button"
                  onClick={() => { setMode(t.key); setError(null); }}
                  className={`text-xs tracking-wide transition-colors ${
                    mode === t.key ? 'text-neutral-900 font-medium' : 'text-neutral-400 hover:text-neutral-700'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>

            <div className="space-y-4">
              {mode === 'signup' && (
                <Input
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  onKeyDown={handleKeyDown}
                  placeholder="이름 (선택)"
                  disabled={submitting}
                />
              )}
              <Input
                type="email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder="이메일"
                disabled={submitting}
                autoFocus
              />
              <Input
                type="password"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder={mode === 'signup' ? '비밀번호 (8자 이상)' : '비밀번호'}
                disabled={submitting}
              />
            </div>

            {error && (
              <div className="mt-4 text-xs text-red-500 font-light">
                {error}
              </div>
            )}

            <div className="mt-8">
              <Button
                variant="primary"
                size="lg"
                onClick={submit}
                disabled={submitting}
                className="w-full"
              >
                {submitting ? '처리 중...' : (mode === 'signup' ? '회원가입' : '로그인')}
              </Button>
            </div>
          </div>
        </main>
      );
    }

    // ========================================
    // Todo screen
    // ========================================

    function TodoItem({ todo, onToggle, onDelete }) {
      return (
        <li className="group flex items-center gap-4 py-4 border-b border-neutral-100 fade-in">
          <Checkbox
            checked={todo.completed}
            onChange={() => onToggle(todo.id)}
            ariaLabel={`${todo.text} 완료 토글`}
          />
          <span
            className={`flex-1 text-sm transition-colors ${
              todo.completed
                ? 'text-neutral-400 line-through'
                : 'text-neutral-800'
            }`}
          >
            {todo.text}
          </span>
          <Button
            variant="danger"
            size="sm"
            onClick={() => onDelete(todo.id)}
            className="opacity-0 group-hover:opacity-100 focus:opacity-100"
          >
            삭제
          </Button>
        </li>
      );
    }

    function FilterTabs({ filter, onChange, counts }) {
      const tabs = [
        { key: 'all', label: '전체' },
        { key: 'active', label: '진행중' },
        { key: 'completed', label: '완료' },
      ];
      return (
        <div className="flex items-center gap-6">
          {tabs.map(tab => (
            <button
              key={tab.key}
              type="button"
              onClick={() => onChange(tab.key)}
              className={`text-xs tracking-wide transition-colors ${
                filter === tab.key
                  ? 'text-neutral-900 font-medium'
                  : 'text-neutral-400 hover:text-neutral-700'
              }`}
            >
              {tab.label}
              <span className="ml-1 text-neutral-300">{counts[tab.key]}</span>
            </button>
          ))}
        </div>
      );
    }

    function TodoPage({ user, onLogout, onAuthError }) {
      const [todos, setTodos] = useState([]);
      const [input, setInput] = useState('');
      const [filter, setFilter] = useState('all');
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [submitting, setSubmitting] = useState(false);

      const handleError = useCallback((e, fallback) => {
        if (e instanceof AuthError) {
          onAuthError();
          return;
        }
        setError(e.message || fallback);
      }, [onAuthError]);

      const refresh = async () => {
        try {
          setError(null);
          const data = await api.list();
          setTodos(Array.isArray(data) ? data : []);
        } catch (e) {
          handleError(e, '불러오기에 실패했습니다.');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        refresh();
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);

      const addTodo = async () => {
        const text = input.trim();
        if (!text || submitting) return;
        setSubmitting(true);
        setError(null);
        try {
          const created = await api.create(text);
          setTodos(prev => [created, ...prev]);
          setInput('');
        } catch (e) {
          handleError(e, '추가에 실패했습니다.');
        } finally {
          setSubmitting(false);
        }
      };

      const toggleTodo = async (id) => {
        const target = todos.find(t => t.id === id);
        if (!target) return;
        const nextCompleted = !target.completed;
        setTodos(prev => prev.map(t => t.id === id ? { ...t, completed: nextCompleted } : t));
        try {
          await api.update(id, { completed: nextCompleted });
        } catch (e) {
          handleError(e, '업데이트에 실패했습니다.');
          setTodos(prev => prev.map(t => t.id === id ? { ...t, completed: !nextCompleted } : t));
        }
      };

      const deleteTodo = async (id) => {
        const prevTodos = todos;
        setTodos(prev => prev.filter(t => t.id !== id));
        try {
          await api.remove(id);
        } catch (e) {
          handleError(e, '삭제에 실패했습니다.');
          setTodos(prevTodos);
        }
      };

      const clearCompleted = async () => {
        const prevTodos = todos;
        setTodos(prev => prev.filter(t => !t.completed));
        try {
          await api.clearCompleted();
        } catch (e) {
          handleError(e, '완료 항목 비우기에 실패했습니다.');
          setTodos(prevTodos);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addTodo();
        }
      };

      const counts = useMemo(() => ({
        all: todos.length,
        active: todos.filter(t => !t.completed).length,
        completed: todos.filter(t => t.completed).length,
      }), [todos]);

      const visibleTodos = useMemo(() => {
        if (filter === 'active') return todos.filter(t => !t.completed);
        if (filter === 'completed') return todos.filter(t => t.completed);
        return todos;
      }, [todos, filter]);

      return (
        <main className="min-h-screen w-full flex justify-center px-4 sm:px-6 py-12 sm:py-16">
          <div className="w-full max-w-xl">
            <div className="flex items-center justify-end gap-4 mb-10">
              <span className="text-xs text-neutral-500 font-light truncate">
                {user && user.email}
              </span>
              <button
                type="button"
                onClick={onLogout}
                className="text-xs tracking-wide text-neutral-400 hover:text-neutral-900 transition-colors"
              >
                로그아웃
              </button>
            </div>

            <header className="mb-12 text-center">
              <h1 className="text-4xl font-extralight tracking-widest text-neutral-900 uppercase">
                할 일
              </h1>
              <p className="mt-2 text-sm text-neutral-400 font-light">
                오늘의 할 일을 차분히 정리하세요
              </p>
            </header>

            <section className="mb-2">
              <Input
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder="새로운 할 일을 입력하고 Enter"
                autoFocus
                disabled={submitting}
              />
            </section>

            {error && (
              <div className="mt-4 text-xs text-red-500 font-light">
                {error}
              </div>
            )}

            <section className="mt-8">
              {loading ? (
                <div className="py-20 text-center">
                  <p className="text-sm text-neutral-400 font-light">불러오는 중...</p>
                </div>
              ) : visibleTodos.length === 0 ? (
                <div className="py-20 text-center">
                  <p className="text-sm text-neutral-400 font-light">
                    {filter === 'all' && '아직 등록된 할 일이 없습니다.'}
                    {filter === 'active' && '진행중인 할 일이 없습니다.'}
                    {filter === 'completed' && '완료된 할 일이 없습니다.'}
                  </p>
                </div>
              ) : (
                <ul className="border-t border-neutral-100">
                  {visibleTodos.map(todo => (
                    <TodoItem
                      key={todo.id}
                      todo={todo}
                      onToggle={toggleTodo}
                      onDelete={deleteTodo}
                    />
                  ))}
                </ul>
              )}
            </section>

            {todos.length > 0 && (
              <footer className="mt-8 flex items-center justify-between">
                <FilterTabs filter={filter} onChange={setFilter} counts={counts} />
                <Button
                  variant="ghost"
                  size="sm"
                  onClick={clearCompleted}
                  disabled={counts.completed === 0}
                >
                  완료 항목 비우기
                </Button>
              </footer>
            )}
          </div>
        </main>
      );
    }

    // ========================================
    // App
    // ========================================

    function App() {
      const [status, setStatus] = useState('loading'); // 'loading' | 'auth' | 'app'
      const [user, setUser] = useState(null);

      useEffect(() => {
        const token = tokenStore.get();
        if (!token) { setStatus('auth'); return; }
        (async () => {
          try {
            const { user } = await api.me();
            setUser(user);
            setStatus('app');
          } catch (e) {
            tokenStore.clear();
            setStatus('auth');
          }
        })();
      }, []);

      const handleAuthed = (u) => {
        setUser(u);
        setStatus('app');
      };

      const handleLogout = () => {
        tokenStore.clear();
        setUser(null);
        setStatus('auth');
      };

      if (status === 'loading') {
        return (
          <main className="min-h-screen w-full flex items-center justify-center">
            <p className="text-sm text-neutral-400 font-light">불러오는 중...</p>
          </main>
        );
      }

      if (status === 'auth') {
        return <AuthScreen onAuthed={handleAuthed} />;
      }

      return <TodoPage user={user} onLogout={handleLogout} onAuthError={handleLogout} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
