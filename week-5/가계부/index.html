  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useMemo, useRef } = React;

    const API_BASE = '/api';

    const SCOPES = [
      { key: 'business', label: '사업자' },
      { key: 'personal', label: '개인' },
    ];

    const CATEGORIES = {
      personal: {
        expense: ['식비', '교통', '주거', '구독료', '경조사', '의료/건강', '쇼핑', '여가', '교육', '기타'],
        income:  ['급여', '용돈', '부수입', '이자/배당', '환급', '기타'],
      },
      business: {
        expense: ['직원급여', '임대료', '공과금', '통신/인터넷', '세금/공과', '소프트웨어 구독', '마케팅/광고', '접대비', '사무용품', '출장/교통', '지급수수료', '외주비', '복리후생', '기타'],
        income:  ['매출 정산', '용역 수입', '환급금', '투자/지원금', '이자수익', '기타'],
      },
    };

    const CATEGORY_COLORS = {
      // 개인 지출
      '식비':   'bg-orange-100 text-orange-700',
      '교통':   'bg-sky-100 text-sky-700',
      '주거':   'bg-amber-100 text-amber-700',
      '구독료': 'bg-purple-100 text-purple-700',
      '경조사': 'bg-pink-100 text-pink-700',
      '의료/건강': 'bg-red-100 text-red-700',
      '쇼핑':   'bg-fuchsia-100 text-fuchsia-700',
      '여가':   'bg-indigo-100 text-indigo-700',
      '교육':   'bg-blue-100 text-blue-700',
      // 개인 수입
      '급여':   'bg-emerald-100 text-emerald-700',
      '용돈':   'bg-teal-100 text-teal-700',
      '부수입': 'bg-green-100 text-green-700',
      '이자/배당': 'bg-lime-100 text-lime-700',
      '환급':   'bg-cyan-100 text-cyan-700',
      // 사업자 지출
      '직원급여': 'bg-rose-100 text-rose-700',
      '임대료':   'bg-amber-100 text-amber-700',
      '공과금':   'bg-yellow-100 text-yellow-700',
      '통신/인터넷': 'bg-sky-100 text-sky-700',
      '세금/공과': 'bg-stone-200 text-stone-700',
      '소프트웨어 구독': 'bg-purple-100 text-purple-700',
      '마케팅/광고': 'bg-pink-100 text-pink-700',
      '접대비':   'bg-orange-100 text-orange-700',
      '사무용품': 'bg-slate-200 text-slate-700',
      '출장/교통': 'bg-blue-100 text-blue-700',
      '지급수수료': 'bg-neutral-200 text-neutral-700',
      '외주비':   'bg-violet-100 text-violet-700',
      '복리후생': 'bg-rose-100 text-rose-600',
      // 사업자 수입
      '매출 정산': 'bg-emerald-100 text-emerald-700',
      '용역 수입': 'bg-teal-100 text-teal-700',
      '환급금':   'bg-cyan-100 text-cyan-700',
      '투자/지원금': 'bg-green-100 text-green-700',
      '이자수익': 'bg-lime-100 text-lime-700',
      // 공통
      '기타':   'bg-slate-100 text-slate-700',
    };

    const formatKRW = (n) => new Intl.NumberFormat('ko-KR').format(n || 0) + '원';
    const todayStr = () => new Date().toISOString().slice(0, 10);

    // Add months to YYYY-MM-DD, clamping day to last of month
    const addMonths = (dateStr, months) => {
      const [y, m, d] = dateStr.split('-').map(Number);
      const target = new Date(y, m - 1 + months, 1);
      const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
      const day = Math.min(d, lastDay);
      const mm = String(target.getMonth() + 1).padStart(2, '0');
      const dd = String(day).padStart(2, '0');
      return `${target.getFullYear()}-${mm}-${dd}`;
    };

    // Generate monthly occurrences of a recurring entry from its base date up to today.
    const expandRecurring = (entries) => {
      const today = todayStr();
      const result = [...entries];
      const existingKeys = new Set(
        entries.filter(e => e.recurringId).map(e => `${e.recurringId}:${e.date}`)
      );
      entries.forEach(e => {
        if (!e.recurring) return;
        const baseId = e.recurringId || e.id;
        let i = 1;
        while (true) {
          const nextDate = addMonths(e.date, i);
          if (nextDate > today) break;
          const key = `${baseId}:${nextDate}`;
          if (!existingKeys.has(key)) {
            result.push({
              ...e,
              id: `${baseId}-${nextDate}`,
              date: nextDate,
              recurring: false,
              recurringId: baseId,
              receipt: null,
            });
            existingKeys.add(key);
          }
          i++;
        }
      });
      return result;
    };

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', className = '', children, ...props }) {
      const variants = {
        primary:   'bg-indigo-600 hover:bg-indigo-700 text-white',
        secondary: 'bg-slate-200 hover:bg-slate-300 text-slate-800',
        danger:    'bg-rose-500 hover:bg-rose-600 text-white',
        ghost:     'bg-transparent hover:bg-slate-100 text-slate-700',
      };
      const sizes = { sm: 'px-3 py-1.5 text-sm', md: 'px-4 py-2 text-sm', lg: 'px-5 py-3 text-base' };
      return (
        <button
          className={`rounded-lg font-medium transition disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
          {...props}
        >
          {children}
        </button>
      );
    }

    function Input({ label, error, className = '', ...props }) {
      return (
        <label className="block">
          {label && <span className="block text-sm font-medium text-slate-700 mb-1">{label}</span>}
          <input
            className={`w-full rounded-lg border ${error ? 'border-rose-400' : 'border-slate-300'} px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 ${className}`}
            {...props}
          />
          {error && <span className="block text-xs text-rose-500 mt-1">{error}</span>}
        </label>
      );
    }

    function Select({ label, options, className = '', ...props }) {
      return (
        <label className="block">
          {label && <span className="block text-sm font-medium text-slate-700 mb-1">{label}</span>}
          <select
            className={`w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 ${className}`}
            {...props}
          >
            {options.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
        </label>
      );
    }

    function Textarea({ label, className = '', ...props }) {
      return (
        <label className="block">
          {label && <span className="block text-sm font-medium text-slate-700 mb-1">{label}</span>}
          <textarea
            className={`w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 ${className}`}
            {...props}
          />
        </label>
      );
    }

    function Card({ className = '', children }) {
      return <div className={`bg-white rounded-2xl shadow-sm border border-slate-100 p-5 ${className}`}>{children}</div>;
    }

    function Badge({ children, className = '' }) {
      return <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${className}`}>{children}</span>;
    }

    function ScopeTabs({ value, onChange }) {
      return (
        <div className="inline-flex bg-white/20 backdrop-blur rounded-xl p-1">
          {SCOPES.map(s => (
            <button
              key={s.key}
              onClick={() => onChange(s.key)}
              className={`px-5 py-2 rounded-lg text-sm font-semibold transition ${
                value === s.key ? 'bg-white text-indigo-700 shadow' : 'text-white/90 hover:text-white'
              }`}
            >{s.label}</button>
          ))}
        </div>
      );
    }

    // ========================================
    // 🧩 Layout
    // ========================================
    function Header({ totals, scope, onScopeChange }) {
      return (
        <header className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white">
          <div className="max-w-5xl mx-auto px-4 py-6">
            <div className="flex items-center justify-between flex-wrap gap-3">
              <div>
                <h1 className="text-2xl font-bold">💰 가계부</h1>
                <p className="text-indigo-100 text-sm mt-1">
                  {scope === 'business' ? '회사 가계부' : '개인 가계부'}
                </p>
              </div>
              <ScopeTabs value={scope} onChange={onScopeChange} />
            </div>
            <div className="grid grid-cols-3 gap-3 mt-5">
              <div className="bg-white/10 rounded-xl px-4 py-3 backdrop-blur">
                <div className="text-xs text-indigo-100">수입</div>
                <div className="text-lg font-bold">{formatKRW(totals.income)}</div>
              </div>
              <div className="bg-white/10 rounded-xl px-4 py-3 backdrop-blur">
                <div className="text-xs text-indigo-100">지출</div>
                <div className="text-lg font-bold">{formatKRW(totals.expense)}</div>
              </div>
              <div className="bg-white/20 rounded-xl px-4 py-3 backdrop-blur">
                <div className="text-xs text-indigo-100">잔액</div>
                <div className="text-lg font-bold">{formatKRW(totals.balance)}</div>
              </div>
            </div>
          </div>
        </header>
      );
    }

    // ========================================
    // 📄 Page Components
    // ========================================
    function EntryForm({ scope, onAdd }) {
      const [type, setType] = useState('expense');
      const [date, setDate] = useState(todayStr());
      const [amount, setAmount] = useState('');
      const categories = CATEGORIES[scope][type];
      const [category, setCategory] = useState(categories[0]);
      const [memo, setMemo] = useState('');
      const [recurring, setRecurring] = useState(false);
      const [receipt, setReceipt] = useState(null);
      const [error, setError] = useState('');
      const fileRef = useRef(null);

      useEffect(() => { setCategory(CATEGORIES[scope][type][0]); }, [type, scope]);

      const handleFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
          setError('영수증 파일은 2MB 이하여야 합니다');
          return;
        }
        // Keep the File object itself for upload; create a local preview URL.
        setReceipt({ name: file.name, type: file.type, file, previewUrl: URL.createObjectURL(file) });
      };

      const clearReceipt = () => {
        setReceipt(null);
        if (fileRef.current) fileRef.current.value = '';
      };

      const submit = async (e) => {
        e.preventDefault();
        const amt = Number(amount);
        if (!date) return setError('날짜를 입력하세요');
        if (!amt || amt <= 0) return setError('금액을 올바르게 입력하세요');
        setError('');
        try {
          await onAdd({
            scope, type, date,
            amount: amt,
            category,
            memo: memo.trim(),
            recurring,
            receiptFile: receipt?.file || null,
          });
          setAmount(''); setMemo(''); setRecurring(false); clearReceipt();
        } catch (err) {
          setError(err.message || '등록 실패');
        }
      };

      return (
        <Card>
          <h2 className="text-lg font-semibold text-slate-800 mb-4">내역 등록</h2>
          <div className="flex gap-2 mb-4">
            <button
              type="button"
              onClick={() => setType('expense')}
              className={`flex-1 py-2 rounded-lg text-sm font-medium transition ${type === 'expense' ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-600'}`}
            >지출</button>
            <button
              type="button"
              onClick={() => setType('income')}
              className={`flex-1 py-2 rounded-lg text-sm font-medium transition ${type === 'income' ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-600'}`}
            >수입</button>
          </div>
          <form onSubmit={submit} className="space-y-3">
            <div className="grid grid-cols-2 gap-3">
              <Input label="날짜" type="date" value={date} onChange={e => setDate(e.target.value)} />
              <Input label="금액" type="number" min="0" placeholder="0" value={amount} onChange={e => setAmount(e.target.value)} />
            </div>

            <label className="flex items-center gap-2 text-sm text-slate-700 select-none cursor-pointer -mt-1">
              <input
                type="checkbox"
                checked={recurring}
                onChange={e => setRecurring(e.target.checked)}
                className="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-400"
              />
              <span>정기지출 (매월 {date ? `${Number(date.slice(8,10))}일` : '같은 날'}에 자동 추가)</span>
            </label>

            <Select label="카테고리" value={category} onChange={e => setCategory(e.target.value)} options={categories} />
            <Textarea label="메모" rows={2} placeholder="내용을 간단히 적어주세요" value={memo} onChange={e => setMemo(e.target.value)} />

            <div>
              <span className="block text-sm font-medium text-slate-700 mb-1">영수증 첨부</span>
              <div className="flex items-center gap-2">
                <input
                  ref={fileRef}
                  type="file"
                  accept="image/*,.pdf"
                  onChange={handleFile}
                  className="text-sm text-slate-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-50 file:text-indigo-700 file:font-medium hover:file:bg-indigo-100"
                />
                {receipt && (
                  <button type="button" onClick={clearReceipt} className="text-xs text-rose-500 hover:underline">제거</button>
                )}
              </div>
              {receipt && (
                <div className="mt-2 flex items-center gap-2 text-xs text-slate-500">
                  {receipt.type.startsWith('image/') && (
                    <img src={receipt.previewUrl} alt="미리보기" className="w-12 h-12 object-cover rounded border" />
                  )}
                  <span className="truncate">{receipt.name}</span>
                </div>
              )}
            </div>

            {error && <p className="text-sm text-rose-500">{error}</p>}
            <Button type="submit" className="w-full" size="lg">등록하기</Button>
          </form>
        </Card>
      );
    }

    // 기간 선택 UI + 필터 공통 훅
    function usePeriodFilter() {
      const now = new Date();
      const [mode, setMode] = useState('all'); // all | month | year | custom
      const [month, setMonth] = useState(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`);
      const [year, setYear] = useState(String(now.getFullYear()));
      const [from, setFrom] = useState(`${now.getFullYear()}-01-01`);
      const [to, setTo] = useState(todayStr());

      const range = useMemo(() => {
        if (mode === 'month') {
          const [y, m] = month.split('-').map(Number);
          const last = new Date(y, m, 0).getDate();
          return { from: `${month}-01`, to: `${month}-${String(last).padStart(2,'0')}` };
        }
        if (mode === 'year') return { from: `${year}-01-01`, to: `${year}-12-31` };
        if (mode === 'custom') return { from, to };
        return { from: '0000-01-01', to: '9999-12-31' };
      }, [mode, month, year, from, to]);

      const controls = (
        <div className="space-y-2 mb-4">
          <div className="flex gap-1 bg-slate-100 rounded-lg p-1">
            {[['all','전체'],['month','월'],['year','년'],['custom','기간']].map(([k,l]) => (
              <button key={k} onClick={() => setMode(k)}
                className={`flex-1 px-2 py-1 rounded-md text-xs font-medium transition ${mode===k ? 'bg-white shadow text-slate-800':'text-slate-500'}`}>{l}</button>
            ))}
          </div>
          {mode === 'month' && <Input type="month" value={month} onChange={e => setMonth(e.target.value)} />}
          {mode === 'year'  && <Input type="number" min="2000" max="2100" value={year} onChange={e => setYear(e.target.value)} />}
          {mode === 'custom' && (
            <div className="grid grid-cols-2 gap-2">
              <Input type="date" value={from} onChange={e => setFrom(e.target.value)} />
              <Input type="date" value={to}   onChange={e => setTo(e.target.value)} />
            </div>
          )}
        </div>
      );

      return { range, controls };
    }

    function CategorySummary({ entries }) {
      const { range, controls } = usePeriodFilter();

      const filtered = useMemo(
        () => entries.filter(e => !e.recurring && e.date >= range.from && e.date <= range.to),
        [entries, range]
      );

      const summary = useMemo(() => {
        const map = {};
        filtered.forEach(e => {
          const key = `${e.type}:${e.category}`;
          map[key] = (map[key] || 0) + e.amount;
        });
        const expense = Object.entries(map)
          .filter(([k]) => k.startsWith('expense:'))
          .map(([k, v]) => ({ category: k.split(':')[1], total: v }))
          .sort((a, b) => b.total - a.total);
        const income = Object.entries(map)
          .filter(([k]) => k.startsWith('income:'))
          .map(([k, v]) => ({ category: k.split(':')[1], total: v }))
          .sort((a, b) => b.total - a.total);
        return { expense, income };
      }, [filtered]);

      const maxExpense = Math.max(...summary.expense.map(s => s.total), 1);

      return (
        <Card>
          <h2 className="text-lg font-semibold text-slate-800 mb-4">카테고리별 합계</h2>
          {controls}
          {summary.expense.length === 0 && summary.income.length === 0 ? (
            <p className="text-sm text-slate-400 text-center py-8">등록된 내역이 없습니다</p>
          ) : (
            <div className="space-y-5">
              {summary.expense.length > 0 && (
                <div>
                  <h3 className="text-sm font-semibold text-rose-600 mb-2">지출</h3>
                  <div className="space-y-2">
                    {summary.expense.map(s => (
                      <div key={s.category}>
                        <div className="flex justify-between text-sm mb-1">
                          <Badge className={CATEGORY_COLORS[s.category] || 'bg-slate-100 text-slate-700'}>{s.category}</Badge>
                          <span className="font-medium text-slate-700">{formatKRW(s.total)}</span>
                        </div>
                        <div className="h-2 bg-slate-100 rounded-full overflow-hidden">
                          <div className="h-full bg-rose-400" style={{ width: `${(s.total / maxExpense) * 100}%` }} />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {summary.income.length > 0 && (
                <div>
                  <h3 className="text-sm font-semibold text-emerald-600 mb-2">수입</h3>
                  <div className="space-y-1.5">
                    {summary.income.map(s => (
                      <div key={s.category} className="flex justify-between items-center text-sm">
                        <Badge className={CATEGORY_COLORS[s.category] || 'bg-slate-100 text-slate-700'}>{s.category}</Badge>
                        <span className="font-medium text-slate-700">{formatKRW(s.total)}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </Card>
      );
    }

    function MonthlyTrend({ entries }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);
      const [metric, setMetric] = useState('all'); // all | expense-by-category
      const [category, setCategory] = useState('전체');

      // 현재 scope의 카테고리 목록 (지출만)
      const categoryOptions = useMemo(() => {
        const set = new Set(entries.filter(e => e.type === 'expense' && !e.recurring).map(e => e.category));
        return ['전체', ...Array.from(set)];
      }, [entries]);

      // 최근 12개월 범위
      const months = useMemo(() => {
        const arr = [];
        const now = new Date();
        for (let i = 11; i >= 0; i--) {
          const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
          arr.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
        }
        return arr;
      }, []);

      const series = useMemo(() => {
        const ex = Object.fromEntries(months.map(m => [m, 0]));
        const inc = Object.fromEntries(months.map(m => [m, 0]));
        entries.forEach(e => {
          if (e.recurring) return;
          const ym = e.date.slice(0, 7);
          if (!(ym in ex)) return;
          if (metric === 'expense-by-category') {
            if (e.type !== 'expense') return;
            if (category !== '전체' && e.category !== category) return;
            ex[ym] += e.amount;
          } else {
            if (e.type === 'expense') ex[ym] += e.amount;
            else if (e.type === 'income') inc[ym] += e.amount;
          }
        });
        return { expense: months.map(m => ex[m]), income: months.map(m => inc[m]) };
      }, [entries, months, metric, category]);

      useEffect(() => {
        if (!canvasRef.current || !window.Chart) return;
        if (chartRef.current) chartRef.current.destroy();

        const datasets = [];
        datasets.push({
          label: metric === 'expense-by-category' ? `지출: ${category}` : '총 지출',
          data: series.expense,
          borderColor: '#f43f5e',
          backgroundColor: 'rgba(244,63,94,0.15)',
          tension: 0.3,
          fill: true,
        });
        if (metric === 'all') {
          datasets.push({
            label: '총 수입',
            data: series.income,
            borderColor: '#10b981',
            backgroundColor: 'rgba(16,185,129,0.15)',
            tension: 0.3,
            fill: true,
          });
        }

        chartRef.current = new window.Chart(canvasRef.current, {
          type: 'line',
          data: { labels: months, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { position: 'bottom', labels: { font: { size: 11 } } },
              tooltip: {
                callbacks: {
                  label: (ctx) => `${ctx.dataset.label}: ${formatKRW(ctx.parsed.y)}`,
                },
              },
            },
            scales: {
              y: {
                beginAtZero: true,
                ticks: {
                  callback: (v) => v >= 10000 ? `${(v/10000).toFixed(0)}만` : v,
                  font: { size: 10 },
                },
              },
              x: { ticks: { font: { size: 10 } } },
            },
          },
        });

        return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
      }, [series, months, metric, category]);

      return (
        <Card>
          <h2 className="text-lg font-semibold text-slate-800 mb-3">월별 추이 (최근 12개월)</h2>
          <div className="flex gap-1 bg-slate-100 rounded-lg p-1 mb-3">
            <button onClick={() => setMetric('all')}
              className={`flex-1 px-2 py-1 rounded-md text-xs font-medium transition ${metric==='all' ? 'bg-white shadow text-slate-800':'text-slate-500'}`}>지출 vs 수입</button>
            <button onClick={() => setMetric('expense-by-category')}
              className={`flex-1 px-2 py-1 rounded-md text-xs font-medium transition ${metric==='expense-by-category' ? 'bg-white shadow text-slate-800':'text-slate-500'}`}>카테고리별 지출</button>
          </div>
          {metric === 'expense-by-category' && (
            <Select value={category} onChange={e => setCategory(e.target.value)} options={categoryOptions} className="mb-3" />
          )}
          <div className="h-64">
            <canvas ref={canvasRef} />
          </div>
        </Card>
      );
    }

    function EditModal({ entry, onClose, onSave }) {
      if (!entry) return null;
      const scope = entry.scope;
      const [type, setType] = useState(entry.type);
      const [date, setDate] = useState(entry.date);
      const [amount, setAmount] = useState(String(entry.amount));
      const [category, setCategory] = useState(entry.category);
      const [memo, setMemo] = useState(entry.memo || '');
      const [error, setError] = useState('');
      const [saving, setSaving] = useState(false);
      const categories = CATEGORIES[scope][type];

      useEffect(() => {
        if (!categories.includes(category)) setCategory(categories[0]);
      }, [type]);

      const submit = async (e) => {
        e.preventDefault();
        const amt = Number(amount);
        if (!date) return setError('날짜를 입력하세요');
        if (!amt || amt <= 0) return setError('금액을 확인하세요');
        setError(''); setSaving(true);
        try {
          await onSave(entry.id, { scope, type, date, amount: amt, category, memo: memo.trim() });
          onClose();
        } catch (err) {
          setError(err.message || '수정 실패');
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-white rounded-2xl max-w-md w-full p-5" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-lg font-semibold text-slate-800">내역 수정 {entry.recurring && <Badge className="ml-2 bg-indigo-100 text-indigo-700">정기규칙</Badge>}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-700">✕</button>
            </div>
            <form onSubmit={submit} className="space-y-3">
              <div className="flex gap-2">
                <button type="button" onClick={() => setType('expense')}
                  className={`flex-1 py-2 rounded-lg text-sm font-medium transition ${type === 'expense' ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-600'}`}>지출</button>
                <button type="button" onClick={() => setType('income')}
                  className={`flex-1 py-2 rounded-lg text-sm font-medium transition ${type === 'income' ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-600'}`}>수입</button>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <Input label={entry.recurring ? '시작일' : '날짜'} type="date" value={date} onChange={e => setDate(e.target.value)} />
                <Input label="금액" type="number" min="0" value={amount} onChange={e => setAmount(e.target.value)} />
              </div>
              <Select label="카테고리" value={category} onChange={e => setCategory(e.target.value)} options={categories} />
              <Textarea label="메모" rows={2} value={memo} onChange={e => setMemo(e.target.value)} />
              {error && <p className="text-sm text-rose-500">{error}</p>}
              <div className="flex gap-2 pt-2">
                <Button type="button" variant="secondary" className="flex-1" onClick={onClose}>취소</Button>
                <Button type="submit" className="flex-1" disabled={saving}>{saving ? '저장중…' : '저장'}</Button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function ReceiptModal({ receipt, onClose }) {
      if (!receipt) return null;
      return (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-auto p-4" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-center mb-3">
              <h3 className="font-semibold text-slate-800 truncate">{receipt.name}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-700">✕</button>
            </div>
            {receipt.type.startsWith('image/') ? (
              <img src={receipt.url} alt={receipt.name} className="w-full rounded-lg" />
            ) : (
              <a href={receipt.url} download={receipt.name} target="_blank" rel="noreferrer" className="block text-center py-8 text-indigo-600 underline">
                📎 파일 열기 / 다운로드
              </a>
            )}
          </div>
        </div>
      );
    }

    function EntryList({ entries, onDelete, onEdit }) {
      const [filter, setFilter] = useState('all');
      const [viewReceipt, setViewReceipt] = useState(null);

      const filtered = useMemo(() => {
        const arr = filter === 'all' ? entries : entries.filter(e => e.type === filter);
        return [...arr].sort((a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id)));
      }, [entries, filter]);

      return (
        <Card>
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-lg font-semibold text-slate-800">내역 목록</h2>
            <div className="flex gap-1 bg-slate-100 rounded-lg p-1">
              {[['all', '전체'], ['income', '수입'], ['expense', '지출']].map(([k, label]) => (
                <button
                  key={k}
                  onClick={() => setFilter(k)}
                  className={`px-3 py-1 rounded-md text-xs font-medium transition ${filter === k ? 'bg-white shadow text-slate-800' : 'text-slate-500'}`}
                >{label}</button>
              ))}
            </div>
          </div>
          {filtered.length === 0 ? (
            <p className="text-sm text-slate-400 text-center py-10">표시할 내역이 없습니다</p>
          ) : (
            <ul className="divide-y divide-slate-100">
              {filtered.map(e => (
                <li key={e.id} className="py-3 flex items-center gap-3">
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 mb-1 flex-wrap">
                      <Badge className={CATEGORY_COLORS[e.category] || 'bg-slate-100 text-slate-700'}>{e.category}</Badge>
                      <span className="text-xs text-slate-400">{e.date}</span>
                      {e.recurring && <Badge className="bg-indigo-100 text-indigo-700">🔁 정기</Badge>}
                      {e.recurringId && !e.recurring && <Badge className="bg-slate-100 text-slate-500">자동</Badge>}
                      {e.receipt && (
                        <button
                          onClick={() => setViewReceipt(e.receipt)}
                          className="text-xs text-indigo-600 hover:underline"
                        >📎 영수증</button>
                      )}
                    </div>
                    {e.memo && <p className="text-sm text-slate-600 truncate">{e.memo}</p>}
                  </div>
                  <div className={`text-sm font-bold ${e.type === 'income' ? 'text-emerald-600' : 'text-rose-500'}`}>
                    {e.type === 'income' ? '+' : '-'}{formatKRW(e.amount)}
                  </div>
                  {!(e.recurringId && !e.recurring) && (
                    <button
                      onClick={() => onEdit(e)}
                      className="text-slate-400 hover:text-indigo-600 transition text-sm"
                      aria-label="편집"
                      title="편집"
                    >✎</button>
                  )}
                  <button
                    onClick={() => onDelete(e.id)}
                    className="text-slate-300 hover:text-rose-500 transition"
                    aria-label="삭제"
                  >✕</button>
                </li>
              ))}
            </ul>
          )}
          <ReceiptModal receipt={viewReceipt} onClose={() => setViewReceipt(null)} />
        </Card>
      );
    }

    function ExcelExport({ entries }) {
      const [mode, setMode] = useState('month'); // month | year | custom
      const now = new Date();
      const [month, setMonth] = useState(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`);
      const [year, setYear] = useState(String(now.getFullYear()));
      const [from, setFrom] = useState(todayStr());
      const [to, setTo] = useState(todayStr());

      const getRange = () => {
        if (mode === 'month') {
          const [y, m] = month.split('-').map(Number);
          const last = new Date(y, m, 0).getDate();
          return {
            from: `${month}-01`,
            to: `${month}-${String(last).padStart(2,'0')}`,
            label: `${month}`,
          };
        }
        if (mode === 'year') {
          return { from: `${year}-01-01`, to: `${year}-12-31`, label: year };
        }
        return { from, to, label: `${from}_${to}` };
      };

      const download = () => {
        const { from: f, to: t, label } = getRange();
        const rows = entries
          .filter(e => e.date >= f && e.date <= t)
          .sort((a, b) => a.date.localeCompare(b.date))
          .map(e => ({
            '날짜': e.date,
            '구분': (e.scope === 'business') ? '사업자' : '개인',
            '유형': e.type === 'income' ? '수입' : '지출',
            '카테고리': e.category,
            '금액': e.amount,
            '메모': e.memo || '',
            '정기': e.recurring ? 'Y' : (e.recurringId ? '자동' : ''),
            '영수증': e.receipt ? e.receipt.name : '',
          }));

        if (rows.length === 0) {
          alert('해당 기간에 내역이 없습니다');
          return;
        }

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.json_to_sheet(rows);
        ws['!cols'] = [{wch:12},{wch:8},{wch:8},{wch:10},{wch:12},{wch:24},{wch:8},{wch:20}];
        XLSX.utils.book_append_sheet(wb, ws, '내역');

        // 카테고리별 합계 시트
        const sumMap = {};
        rows.forEach(r => {
          const key = `${r.구분}|${r.유형}|${r.카테고리}`;
          sumMap[key] = (sumMap[key] || 0) + r.금액;
        });
        const sumRows = Object.entries(sumMap).map(([k, v]) => {
          const [g, t2, c] = k.split('|');
          return { '구분': g, '유형': t2, '카테고리': c, '합계': v };
        });
        const ws2 = XLSX.utils.json_to_sheet(sumRows);
        ws2['!cols'] = [{wch:8},{wch:8},{wch:10},{wch:14}];
        XLSX.utils.book_append_sheet(wb, ws2, '카테고리합계');

        XLSX.writeFile(wb, `가계부_${label}.xlsx`);
      };

      return (
        <Card>
          <h2 className="text-lg font-semibold text-slate-800 mb-4">엑셀 다운로드</h2>
          <div className="flex gap-1 bg-slate-100 rounded-lg p-1 mb-3">
            {[['month','월'],['year','년'],['custom','기간지정']].map(([k,l]) => (
              <button
                key={k}
                onClick={() => setMode(k)}
                className={`flex-1 px-3 py-1.5 rounded-md text-xs font-medium transition ${mode===k ? 'bg-white shadow text-slate-800':'text-slate-500'}`}
              >{l}</button>
            ))}
          </div>
          {mode === 'month' && (
            <Input label="월 선택" type="month" value={month} onChange={e => setMonth(e.target.value)} />
          )}
          {mode === 'year' && (
            <Input label="연도" type="number" min="2000" max="2100" value={year} onChange={e => setYear(e.target.value)} />
          )}
          {mode === 'custom' && (
            <div className="grid grid-cols-2 gap-2">
              <Input label="시작일" type="date" value={from} onChange={e => setFrom(e.target.value)} />
              <Input label="종료일" type="date" value={to} onChange={e => setTo(e.target.value)} />
            </div>
          )}
          <Button className="w-full mt-4" size="lg" onClick={download}>📥 엑셀로 다운로드</Button>
          <p className="text-xs text-slate-400 mt-2">현재 선택된 구분({entries.length > 0 ? (entries[0].scope==='business'?'사업자':'개인') : '-'})의 내역만 받습니다</p>
        </Card>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      const [scope, setScope] = useState('personal');
      const [entries, setEntries] = useState([]);
      const [loading, setLoading] = useState(false);
      const [apiError, setApiError] = useState('');
      const [editingEntry, setEditingEntry] = useState(null);

      const fetchEntries = async (s = scope) => {
        setLoading(true);
        setApiError('');
        try {
          const r = await fetch(`${API_BASE}/entries?scope=${s}`);
          const j = await r.json();
          if (!j.success) throw new Error(j.message || '불러오기 실패');
          setEntries(j.data);
        } catch (e) {
          setApiError(e.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { fetchEntries(scope); }, [scope]);

      // scoped to current scope (server already filtered, but keep for safety)
      const scopedEntries = useMemo(
        () => entries.filter(e => (e.scope || 'personal') === scope),
        [entries, scope]
      );

      const totals = useMemo(() => {
        const income = scopedEntries.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
        const expense = scopedEntries.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
        return { income, expense, balance: income - expense };
      }, [scopedEntries]);

      const addEntry = async ({ receiptFile, ...payload }) => {
        const r = await fetch(`${API_BASE}/entries`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const j = await r.json();
        if (!j.success) throw new Error(j.message || '등록 실패');
        const created = j.data;

        // upload receipt if present AND created is a real entry (not a recurring rule)
        if (receiptFile && typeof created.id === 'string' && created.id.startsWith('e')) {
          const fd = new FormData();
          fd.append('file', receiptFile);
          const rr = await fetch(`${API_BASE}/entries/${created.id}/receipt`, { method: 'POST', body: fd });
          const jj = await rr.json();
          if (jj.success) created.receipt = jj.data;
        }
        await fetchEntries(scope);
      };

      const editEntry = async (id, payload) => {
        const r = await fetch(`${API_BASE}/entries/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const j = await r.json();
        if (!j.success) throw new Error(j.message || '수정 실패');
        await fetchEntries(scope);
      };

      const deleteEntry = async (id) => {
        // virtual expanded occurrences (e.g. "r12-2026-03-01") are not individually deletable
        if (typeof id === 'string' && /^r\d+-/.test(id)) {
          alert('자동 생성된 정기내역은 삭제할 수 없습니다. 정기 규칙 자체를 삭제하세요.');
          return;
        }
        const r = await fetch(`${API_BASE}/entries/${id}`, { method: 'DELETE' });
        const j = await r.json();
        if (!j.success) { setApiError(j.message || '삭제 실패'); return; }
        await fetchEntries(scope);
      };

      return (
        <div>
          <Header totals={totals} scope={scope} onScopeChange={setScope} />
          <main className="max-w-5xl mx-auto px-4 py-6 grid gap-5 md:grid-cols-2">
            <div className="space-y-5">
              <EntryForm scope={scope} onAdd={addEntry} />
              <CategorySummary entries={scopedEntries} />
              <MonthlyTrend entries={scopedEntries} />
              <ExcelExport entries={scopedEntries} />
            </div>
            <div className="space-y-3">
              {loading && <div className="text-sm text-slate-500 px-2">불러오는 중…</div>}
              {apiError && <div className="text-sm text-rose-600 px-2">⚠ {apiError}</div>}
              <EntryList entries={scopedEntries} onDelete={deleteEntry} onEdit={setEditingEntry} />
            </div>
          </main>
          <EditModal entry={editingEntry} onClose={() => setEditingEntry(null)} onSave={editEntry} />
          <footer className="text-center text-xs text-slate-400 py-6">데이터는 서버(PostgreSQL)에 저장됩니다</footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
