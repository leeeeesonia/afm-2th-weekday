<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    // Tailwind config — map shadcn design tokens to Tailwind utilities
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: {
              DEFAULT: 'hsl(var(--primary))',
              foreground: 'hsl(var(--primary-foreground))',
            },
            secondary: {
              DEFAULT: 'hsl(var(--secondary))',
              foreground: 'hsl(var(--secondary-foreground))',
            },
            destructive: {
              DEFAULT: 'hsl(var(--destructive))',
              foreground: 'hsl(var(--destructive-foreground))',
            },
            muted: {
              DEFAULT: 'hsl(var(--muted))',
              foreground: 'hsl(var(--muted-foreground))',
            },
            accent: {
              DEFAULT: 'hsl(var(--accent))',
              foreground: 'hsl(var(--accent-foreground))',
            },
            card: {
              DEFAULT: 'hsl(var(--card))',
              foreground: 'hsl(var(--card-foreground))',
            },
          },
          borderRadius: {
            lg: 'var(--radius)',
            md: 'calc(var(--radius) - 2px)',
            sm: 'calc(var(--radius) - 4px)',
          },
        },
      },
    };
  </script>
  <style>
    /* shadcn/ui design tokens — light & dark themes */
    :root {
      --background: 0 0% 100%;
      --foreground: 240 10% 3.9%;
      --card: 0 0% 100%;
      --card-foreground: 240 10% 3.9%;
      --primary: 240 5.9% 10%;
      --primary-foreground: 0 0% 98%;
      --secondary: 240 4.8% 95.9%;
      --secondary-foreground: 240 5.9% 10%;
      --muted: 240 4.8% 95.9%;
      --muted-foreground: 240 3.8% 46.1%;
      --accent: 240 4.8% 95.9%;
      --accent-foreground: 240 5.9% 10%;
      --destructive: 0 84.2% 60.2%;
      --destructive-foreground: 0 0% 98%;
      --border: 240 5.9% 90%;
      --input: 240 5.9% 90%;
      --ring: 240 5.9% 10%;
      --radius: 0.5rem;
    }
    .dark {
      --background: 240 10% 3.9%;
      --foreground: 0 0% 98%;
      --card: 240 10% 3.9%;
      --card-foreground: 0 0% 98%;
      --primary: 0 0% 98%;
      --primary-foreground: 240 5.9% 10%;
      --secondary: 240 3.7% 15.9%;
      --secondary-foreground: 0 0% 98%;
      --muted: 240 3.7% 15.9%;
      --muted-foreground: 240 5% 64.9%;
      --accent: 240 3.7% 15.9%;
      --accent-foreground: 0 0% 98%;
      --destructive: 0 62.8% 30.6%;
      --destructive-foreground: 0 0% 98%;
      --border: 240 3.7% 15.9%;
      --input: 240 3.7% 15.9%;
      --ring: 240 4.9% 83.9%;
    }
    body {
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: hsl(var(--border)); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: hsl(var(--muted-foreground)); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ========================================
    // 🎨 Design System Components (shadcn/ui style)
    // ========================================

    function Button({ variant = 'default', size = 'md', className = '', children, ...props }) {
      const base = 'inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50';
      const variants = {
        default: 'bg-primary text-primary-foreground hover:bg-primary/90',
        secondary: 'bg-secondary text-secondary-foreground hover:bg-secondary/80',
        outline: 'border border-input bg-background hover:bg-accent hover:text-accent-foreground',
        ghost: 'hover:bg-accent hover:text-accent-foreground',
        destructive: 'bg-destructive text-destructive-foreground hover:bg-destructive/90',
      };
      const sizes = {
        sm: 'h-8 px-3 text-xs',
        md: 'h-9 px-4 py-2',
        lg: 'h-10 px-6',
        icon: 'h-9 w-9',
      };
      return (
        <button className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...props}>
          {children}
        </button>
      );
    }

    function Input({ className = '', ...props }) {
      return (
        <input
          className={`flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm transition-colors placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 ${className}`}
          {...props}
        />
      );
    }

    function Card({ className = '', children, ...props }) {
      return (
        <div className={`rounded-lg border border-border bg-card text-card-foreground shadow-sm ${className}`} {...props}>
          {children}
        </div>
      );
    }
    function CardHeader({ className = '', children }) {
      return <div className={`flex flex-col space-y-1.5 p-6 ${className}`}>{children}</div>;
    }
    function CardTitle({ className = '', children }) {
      return <h3 className={`text-sm font-medium tracking-tight ${className}`}>{children}</h3>;
    }
    function CardDescription({ className = '', children }) {
      return <p className={`text-sm text-muted-foreground ${className}`}>{children}</p>;
    }
    function CardContent({ className = '', children }) {
      return <div className={`p-6 pt-0 ${className}`}>{children}</div>;
    }

    function Badge({ variant = 'default', className = '', children }) {
      const variants = {
        default: 'border-transparent bg-primary text-primary-foreground',
        secondary: 'border-transparent bg-secondary text-secondary-foreground',
        destructive: 'border-transparent bg-destructive text-destructive-foreground',
        outline: 'text-foreground',
        success: 'border-transparent bg-emerald-500/15 text-emerald-600 dark:text-emerald-400',
        warning: 'border-transparent bg-amber-500/15 text-amber-600 dark:text-amber-400',
        info: 'border-transparent bg-blue-500/15 text-blue-600 dark:text-blue-400',
      };
      return (
        <span className={`inline-flex items-center rounded-md border px-2 py-0.5 text-xs font-medium transition-colors ${variants[variant]} ${className}`}>
          {children}
        </span>
      );
    }

    function Avatar({ initials, src, className = '' }) {
      return (
        <div className={`relative flex h-9 w-9 shrink-0 overflow-hidden rounded-full bg-muted ${className}`}>
          {src ? (
            <img src={src} alt="" className="aspect-square h-full w-full object-cover" />
          ) : (
            <span className="flex h-full w-full items-center justify-center text-xs font-medium text-muted-foreground">
              {initials}
            </span>
          )}
        </div>
      );
    }

    function Separator({ className = '' }) {
      return <div className={`shrink-0 bg-border h-[1px] w-full ${className}`} />;
    }

    // ========================================
    // 🎨 Icons (inline SVG — lucide style)
    // ========================================

    const Icon = ({ path, className = 'h-4 w-4' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {path}
      </svg>
    );
    const Icons = {
      dashboard: <><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></>,
      users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
      list: <><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></>,
      settings: <><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>,
      search: <><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>,
      bell: <><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></>,
      sun: <><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></>,
      moon: <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>,
      clock: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
      users2: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></>,
      checkSquare: <><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></>,
      trendUp: <><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></>,
      trendDown: <><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></>,
      more: <><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></>,
      edit: <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>,
      trash: <><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>,
      logo: <><path d="M12 2L2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></>,
    };

    // ========================================
    // 📊 Mockup Data
    // ========================================

    const stats = [
      { label: '총 유저', value: '1,284', delta: '+12.3%', trend: 'up', icon: 'users2' },
      { label: '총 Todo', value: '8,429', delta: '+5.7%', trend: 'up', icon: 'list' },
      { label: '오늘 완료', value: '312', delta: '+23.1%', trend: 'up', icon: 'checkSquare' },
      { label: '미완료', value: '1,893', delta: '-2.4%', trend: 'down', icon: 'clock' },
    ];

    const todos = [
      { id: 'TD-1042', title: '주간 회고 작성', user: { name: '김소니아', initials: 'KS' }, status: 'completed', createdAt: '2026-04-14 09:12' },
      { id: 'TD-1041', title: 'API 설계 문서 리뷰', user: { name: '박지훈', initials: 'PJ' }, status: 'in_progress', createdAt: '2026-04-14 08:47' },
      { id: 'TD-1040', title: '신규 유저 온보딩 플로우 QA', user: { name: '이수민', initials: 'LS' }, status: 'pending', createdAt: '2026-04-14 08:03' },
      { id: 'TD-1039', title: '데이터베이스 인덱스 최적화', user: { name: '최도윤', initials: 'CD' }, status: 'in_progress', createdAt: '2026-04-13 22:55' },
      { id: 'TD-1038', title: '결제 모듈 테스트 케이스 보완', user: { name: '정하린', initials: 'JH' }, status: 'overdue', createdAt: '2026-04-13 17:20' },
      { id: 'TD-1037', title: '프론트 번들 사이즈 리포트', user: { name: '김소니아', initials: 'KS' }, status: 'completed', createdAt: '2026-04-13 14:08' },
      { id: 'TD-1036', title: '컴포넌트 라이브러리 문서화', user: { name: '박지훈', initials: 'PJ' }, status: 'pending', createdAt: '2026-04-13 11:42' },
      { id: 'TD-1035', title: '보안 감사 리포트 공유', user: { name: '이수민', initials: 'LS' }, status: 'completed', createdAt: '2026-04-12 19:30' },
    ];

    const activities = [
      { user: { name: '김소니아', initials: 'KS' }, action: '새 Todo를 생성했습니다', target: '주간 회고 작성', time: '2분 전' },
      { user: { name: '박지훈', initials: 'PJ' }, action: 'Todo를 완료했습니다', target: 'API 설계 문서 리뷰', time: '14분 전' },
      { user: { name: '이수민', initials: 'LS' }, action: '팀에 가입했습니다', target: 'Design System', time: '1시간 전' },
      { user: { name: '최도윤', initials: 'CD' }, action: 'Todo를 업데이트했습니다', target: 'DB 인덱스 최적화', time: '2시간 전' },
      { user: { name: '정하린', initials: 'JH' }, action: '댓글을 남겼습니다', target: '결제 모듈 테스트', time: '3시간 전' },
      { user: { name: '김소니아', initials: 'KS' }, action: 'Todo를 삭제했습니다', target: '레거시 스크립트 정리', time: '5시간 전' },
    ];

    const statusMap = {
      completed: { label: '완료', variant: 'success' },
      in_progress: { label: '진행중', variant: 'info' },
      pending: { label: '대기', variant: 'secondary' },
      overdue: { label: '지연', variant: 'destructive' },
    };

    // ========================================
    // 🧩 Layout Components
    // ========================================

    function Sidebar({ current, onNav }) {
      const items = [
        { key: 'dashboard', label: 'Dashboard', icon: 'dashboard' },
        { key: 'users', label: 'Users', icon: 'users' },
        { key: 'todos', label: 'Todos', icon: 'list' },
        { key: 'settings', label: 'Settings', icon: 'settings' },
      ];
      return (
        <aside className="hidden md:flex w-60 shrink-0 flex-col border-r border-border bg-card">
          <div className="flex h-14 items-center gap-2 border-b border-border px-6">
            <div className="flex h-7 w-7 items-center justify-center rounded-md bg-primary text-primary-foreground">
              <Icon path={Icons.logo} className="h-4 w-4" />
            </div>
            <span className="text-sm font-semibold tracking-tight">TodoAdmin</span>
          </div>
          <nav className="flex-1 space-y-1 p-3">
            <div className="px-3 py-2 text-xs font-medium text-muted-foreground">Overview</div>
            {items.map(item => {
              const active = current === item.key;
              return (
                <button
                  key={item.key}
                  onClick={() => onNav(item.key)}
                  className={`flex w-full items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors ${
                    active
                      ? 'bg-accent text-accent-foreground'
                      : 'text-muted-foreground hover:bg-accent hover:text-accent-foreground'
                  }`}
                >
                  <Icon path={Icons[item.icon]} className="h-4 w-4" />
                  {item.label}
                </button>
              );
            })}
          </nav>
          <div className="border-t border-border p-3">
            <div className="flex items-center gap-3 rounded-md px-2 py-2">
              <Avatar initials="KS" />
              <div className="min-w-0 flex-1">
                <div className="truncate text-sm font-medium">김소니아</div>
                <div className="truncate text-xs text-muted-foreground">admin@todo.dev</div>
              </div>
            </div>
          </div>
        </aside>
      );
    }

    function Header({ theme, toggleTheme }) {
      return (
        <header className="sticky top-0 z-10 flex h-14 items-center gap-4 border-b border-border bg-background/80 px-4 md:px-6 backdrop-blur">
          <div className="relative flex-1 max-w-md">
            <Icon path={Icons.search} className="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" />
            <Input placeholder="Todo, 유저 검색…" className="pl-9" />
          </div>
          <div className="flex items-center gap-2">
            <Button variant="ghost" size="icon" onClick={toggleTheme} aria-label="테마 전환">
              <Icon path={theme === 'dark' ? Icons.sun : Icons.moon} className="h-4 w-4" />
            </Button>
            <Button variant="ghost" size="icon" aria-label="알림" className="relative">
              <Icon path={Icons.bell} className="h-4 w-4" />
              <span className="absolute right-2 top-2 h-1.5 w-1.5 rounded-full bg-destructive" />
            </Button>
            <Separator className="mx-1 h-6 w-px" />
            <Avatar initials="KS" />
          </div>
        </header>
      );
    }

    // ========================================
    // 📄 Dashboard Page Components
    // ========================================

    function StatCard({ stat }) {
      const up = stat.trend === 'up';
      return (
        <Card>
          <CardHeader className="flex flex-row items-center justify-between space-y-0 pb-2">
            <CardTitle className="text-sm font-medium text-muted-foreground">{stat.label}</CardTitle>
            <Icon path={Icons[stat.icon]} className="h-4 w-4 text-muted-foreground" />
          </CardHeader>
          <CardContent>
            <div className="text-2xl font-bold tracking-tight">{stat.value}</div>
            <div className="mt-1 flex items-center gap-1 text-xs">
              <Icon
                path={up ? Icons.trendUp : Icons.trendDown}
                className={`h-3 w-3 ${up ? 'text-emerald-500' : 'text-rose-500'}`}
              />
              <span className={up ? 'text-emerald-500' : 'text-rose-500'}>{stat.delta}</span>
              <span className="text-muted-foreground">vs 지난주</span>
            </div>
          </CardContent>
        </Card>
      );
    }

    function TodoTable() {
      const [openMenu, setOpenMenu] = useState(null);
      return (
        <Card className="col-span-1 xl:col-span-2">
          <CardHeader className="flex flex-row items-center justify-between">
            <div>
              <CardTitle className="text-base font-semibold">최근 Todo</CardTitle>
              <CardDescription>이번 주 생성된 모든 Todo 목록</CardDescription>
            </div>
            <Button variant="outline" size="sm">전체 보기</Button>
          </CardHeader>
          <CardContent className="p-0">
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="border-b border-border text-muted-foreground">
                    <th className="px-6 py-3 text-left font-medium">ID</th>
                    <th className="px-6 py-3 text-left font-medium">제목</th>
                    <th className="px-6 py-3 text-left font-medium">유저</th>
                    <th className="px-6 py-3 text-left font-medium">상태</th>
                    <th className="px-6 py-3 text-left font-medium">생성일</th>
                    <th className="px-6 py-3 text-right font-medium">액션</th>
                  </tr>
                </thead>
                <tbody>
                  {todos.map(todo => {
                    const s = statusMap[todo.status];
                    return (
                      <tr key={todo.id} className="border-b border-border last:border-0 hover:bg-muted/40 transition-colors">
                        <td className="px-6 py-3 font-mono text-xs text-muted-foreground">{todo.id}</td>
                        <td className="px-6 py-3 font-medium">{todo.title}</td>
                        <td className="px-6 py-3">
                          <div className="flex items-center gap-2">
                            <Avatar initials={todo.user.initials} className="h-6 w-6 text-[10px]" />
                            <span className="text-xs">{todo.user.name}</span>
                          </div>
                        </td>
                        <td className="px-6 py-3">
                          <Badge variant={s.variant}>{s.label}</Badge>
                        </td>
                        <td className="px-6 py-3 text-xs text-muted-foreground">{todo.createdAt}</td>
                        <td className="px-6 py-3 text-right">
                          <div className="relative inline-block">
                            <Button
                              variant="ghost"
                              size="icon"
                              onClick={() => setOpenMenu(openMenu === todo.id ? null : todo.id)}
                              aria-label="액션 메뉴"
                            >
                              <Icon path={Icons.more} className="h-4 w-4" />
                            </Button>
                            {openMenu === todo.id && (
                              <div className="absolute right-0 top-full z-20 mt-1 w-36 rounded-md border border-border bg-card py-1 shadow-md">
                                <button className="flex w-full items-center gap-2 px-3 py-1.5 text-sm hover:bg-accent">
                                  <Icon path={Icons.edit} className="h-3.5 w-3.5" /> 편집
                                </button>
                                <button className="flex w-full items-center gap-2 px-3 py-1.5 text-sm text-destructive hover:bg-accent">
                                  <Icon path={Icons.trash} className="h-3.5 w-3.5" /> 삭제
                                </button>
                              </div>
                            )}
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </CardContent>
        </Card>
      );
    }

    function ActivityPanel() {
      return (
        <Card>
          <CardHeader>
            <CardTitle className="text-base font-semibold">최근 활동</CardTitle>
            <CardDescription>팀의 최근 변경 사항</CardDescription>
          </CardHeader>
          <CardContent className="space-y-5">
            {activities.map((a, i) => (
              <div key={i} className="flex items-start gap-3">
                <Avatar initials={a.user.initials} className="h-8 w-8 text-[11px]" />
                <div className="min-w-0 flex-1 space-y-0.5">
                  <p className="text-sm leading-snug">
                    <span className="font-medium">{a.user.name}</span>{' '}
                    <span className="text-muted-foreground">{a.action}</span>
                  </p>
                  <p className="truncate text-xs text-muted-foreground">"{a.target}"</p>
                  <p className="text-xs text-muted-foreground">{a.time}</p>
                </div>
              </div>
            ))}
          </CardContent>
        </Card>
      );
    }

    function DashboardPage() {
      return (
        <div className="space-y-6 p-4 md:p-6">
          <div>
            <h1 className="text-2xl font-bold tracking-tight">Dashboard</h1>
            <p className="text-sm text-muted-foreground">Todo 앱 운영 현황을 한눈에 확인하세요.</p>
          </div>

          <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
            {stats.map(s => <StatCard key={s.label} stat={s} />)}
          </div>

          <div className="grid gap-4 xl:grid-cols-3">
            <TodoTable />
            <ActivityPanel />
          </div>
        </div>
      );
    }

    function PlaceholderPage({ title }) {
      return (
        <div className="p-6">
          <div>
            <h1 className="text-2xl font-bold tracking-tight">{title}</h1>
            <p className="text-sm text-muted-foreground">이 페이지는 아직 준비 중입니다.</p>
          </div>
          <Card className="mt-6">
            <CardContent className="flex flex-col items-center justify-center gap-2 py-16 text-center">
              <div className="flex h-12 w-12 items-center justify-center rounded-full bg-muted">
                <Icon path={Icons.settings} className="h-5 w-5 text-muted-foreground" />
              </div>
              <p className="text-sm font-medium">곧 추가될 예정입니다</p>
              <p className="text-sm text-muted-foreground">Dashboard 탭에서 전체 현황을 확인하세요.</p>
            </CardContent>
          </Card>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      const [current, setCurrent] = useState('dashboard');
      const [theme, setTheme] = useState('light');

      useEffect(() => {
        document.documentElement.classList.toggle('dark', theme === 'dark');
      }, [theme]);

      const toggleTheme = () => setTheme(t => (t === 'dark' ? 'light' : 'dark'));

      const page = useMemo(() => {
        switch (current) {
          case 'dashboard': return <DashboardPage />;
          case 'users': return <PlaceholderPage title="Users" />;
          case 'todos': return <PlaceholderPage title="Todos" />;
          case 'settings': return <PlaceholderPage title="Settings" />;
          default: return <DashboardPage />;
        }
      }, [current]);

      return (
        <div className="flex min-h-screen bg-background text-foreground">
          <Sidebar current={current} onNav={setCurrent} />
          <div className="flex min-w-0 flex-1 flex-col">
            <Header theme={theme} toggleTheme={toggleTheme} />
            <main className="flex-1">{page}</main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
