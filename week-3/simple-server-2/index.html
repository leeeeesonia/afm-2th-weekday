<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀 메시지 잠금 해제</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
      20%, 40%, 60%, 80% { transform: translateX(6px); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes unlockBounce {
      0% { transform: scale(1); }
      30% { transform: scale(1.3); }
      50% { transform: scale(0.9); }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
      50% { opacity: 1; transform: scale(1) rotate(180deg); }
    }
    @keyframes confettiFall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(60px) rotate(360deg); opacity: 0; }
    }
    .shake { animation: shake 0.5s ease-in-out; }
    .fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }
    .unlock-bounce { animation: unlockBounce 0.6s ease-out; }
    .sparkle { animation: sparkle 1.5s ease-in-out infinite; }
    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      animation: confettiFall 1.5s ease-out forwards;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks Destructuring
    // ========================================
    const { useState, useRef, useEffect, useCallback } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ children, onClick, variant = 'primary', size = 'md', disabled = false, className = '' }) {
      const base = 'font-semibold rounded-xl transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-gradient-to-r from-violet-500 to-indigo-600 text-white hover:from-violet-600 hover:to-indigo-700 focus:ring-violet-400 shadow-lg hover:shadow-xl hover:-translate-y-0.5 active:translate-y-0',
        secondary: 'bg-white/20 backdrop-blur text-white border border-white/30 hover:bg-white/30 focus:ring-white/50',
        ghost: 'bg-transparent text-white/70 hover:text-white hover:bg-white/10 focus:ring-white/30',
      };
      const sizes = {
        sm: 'px-4 py-2 text-sm',
        md: 'px-6 py-3 text-base',
        lg: 'px-8 py-4 text-lg',
      };
      return (
        <button
          onClick={onClick}
          disabled={disabled}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Input({ type = 'text', value, onChange, placeholder, error, disabled, className = '', onKeyDown }) {
      return (
        <input
          type={type}
          value={value}
          onChange={onChange}
          onKeyDown={onKeyDown}
          placeholder={placeholder}
          disabled={disabled}
          className={`w-full px-5 py-4 rounded-xl bg-white/10 backdrop-blur border-2 text-white placeholder-white/40 text-lg text-center tracking-widest focus:outline-none focus:ring-2 transition-all duration-300 ${
            error
              ? 'border-red-400 focus:ring-red-400 focus:border-red-400'
              : 'border-white/20 focus:ring-violet-400 focus:border-violet-400'
          } ${className}`}
          aria-label={placeholder}
        />
      );
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-2xl ${className}`}>
          {children}
        </div>
      );
    }

    // ========================================
    // 🔒 Lock Icon Component
    // ========================================
    function LockIcon({ unlocked }) {
      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={`w-16 h-16 mx-auto transition-all duration-500 ${
            unlocked ? 'text-emerald-400 unlock-bounce' : 'text-white/70'
          }`}
        >
          {unlocked ? (
            <>
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 9.9-1" />
            </>
          ) : (
            <>
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </>
          )}
        </svg>
      );
    }

    // ========================================
    // ✨ Confetti Component
    // ========================================
    function Confetti() {
      const colors = ['#a78bfa', '#818cf8', '#34d399', '#fbbf24', '#f472b6', '#60a5fa'];
      const pieces = Array.from({ length: 24 }, (_, i) => ({
        id: i,
        left: `${Math.random() * 100}%`,
        delay: `${Math.random() * 0.8}s`,
        color: colors[i % colors.length],
        size: 6 + Math.random() * 6,
      }));

      return (
        <div className="absolute inset-0 overflow-hidden pointer-events-none">
          {pieces.map((p) => (
            <div
              key={p.id}
              className="confetti"
              style={{
                left: p.left,
                top: '-10px',
                animationDelay: p.delay,
                backgroundColor: p.color,
                width: `${p.size}px`,
                height: `${p.size}px`,
                borderRadius: Math.random() > 0.5 ? '50%' : '2px',
              }}
            />
          ))}
        </div>
      );
    }

    // ========================================
    // ⭐ Sparkle Decorations
    // ========================================
    function Sparkles() {
      const items = [
        { top: '10%', left: '15%', delay: '0s', size: 'text-xl' },
        { top: '20%', right: '20%', delay: '0.5s', size: 'text-2xl' },
        { bottom: '25%', left: '10%', delay: '1s', size: 'text-lg' },
        { bottom: '15%', right: '15%', delay: '0.3s', size: 'text-xl' },
        { top: '40%', left: '5%', delay: '0.8s', size: 'text-sm' },
        { top: '35%', right: '8%', delay: '1.2s', size: 'text-lg' },
      ];
      return (
        <>
          {items.map((s, i) => (
            <span
              key={i}
              className={`sparkle absolute ${s.size} text-yellow-300 pointer-events-none select-none`}
              style={{ ...s, animationDelay: s.delay }}
            >
              &#10022;
            </span>
          ))}
        </>
      );
    }

    // ========================================
    // 📄 SecretMessage App
    // ========================================
    const SECRET_MESSAGES = [
      '축하합니다! 당신은 선택받은 자입니다. 오늘 치킨 한 마리 드세요. 🍗',
      '비밀번호를 맞추다니... 혹시 해커세요? 아니면 천재? 🤔',
      '이 메시지를 본 당신, 오늘 로또 사세요. 느낌이 옵니다. 🎰',
      '당신의 IQ는 측정 불가! 너무 높아서 기계가 고장났습니다. 🧠',
      '극비 정보: 내일 급식 메뉴는 돈까스입니다. (믿거나 말거나) 🍱',
    ];

    function SecretMessageApp() {
      const [password, setPassword] = useState('');
      const [status, setStatus] = useState('locked'); // locked | error | unlocked
      const [shaking, setShaking] = useState(false);
      const [attempts, setAttempts] = useState(0);
      const [secretMsg, setSecretMsg] = useState('');
      const inputRef = useRef(null);

      useEffect(() => {
        if (status !== 'unlocked') {
          setTimeout(() => inputRef.current?.focus(), 300);
        }
      }, [status]);

      const handleSubmit = useCallback(async () => {
        if (!password.trim()) return;

        try {
          const res = await fetch('/api/check-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
          });
          const data = await res.json();

          if (data.success) {
            const randomMsg = SECRET_MESSAGES[Math.floor(Math.random() * SECRET_MESSAGES.length)];
            setSecretMsg(randomMsg);
            setStatus('unlocked');
          } else {
            setStatus('error');
            setShaking(true);
            setAttempts((prev) => prev + 1);
            setTimeout(() => setShaking(false), 500);
            setTimeout(() => {
              setPassword('');
              inputRef.current?.focus();
            }, 600);
          }
        } catch (error) {
          setStatus('error');
          setShaking(true);
          setTimeout(() => setShaking(false), 500);
        }
      }, [password]);

      const handleReset = () => {
        setPassword('');
        setStatus('locked');
        setAttempts(0);
        setSecretMsg('');
        setTimeout(() => inputRef.current?.focus(), 100);
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') handleSubmit();
      };

      const errorHints = [
        '비밀번호가 틀렸습니다!',
        '다시 한번 시도해보세요...',
        '힌트: 숫자 4자리입니다.',
        '힌트: 1로 시작합니다.',
        '마지막 힌트: 1, 2, 3, ...?',
      ];

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
          {/* Background decoration */}
          <div className="absolute inset-0 overflow-hidden pointer-events-none">
            <div className="absolute w-96 h-96 bg-violet-600/20 rounded-full blur-3xl -top-20 -left-20" />
            <div className="absolute w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl -bottom-20 -right-20" />
            <div className="absolute w-64 h-64 bg-pink-600/10 rounded-full blur-3xl top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" />
          </div>

          {status === 'unlocked' && <Sparkles />}

          <Card className="relative w-full max-w-md p-8 sm:p-10">
            {status === 'unlocked' && <Confetti />}

            {/* Header */}
            <div className="text-center mb-8">
              <LockIcon unlocked={status === 'unlocked'} />
              <h1 className="text-2xl sm:text-3xl font-bold text-white mt-4">
                {status === 'unlocked' ? '잠금 해제 완료!' : '비밀 메시지'}
              </h1>
              <p className="text-white/50 mt-2 text-sm">
                {status === 'unlocked'
                  ? '비밀 메시지가 공개되었습니다'
                  : '비밀번호를 입력하여 메시지를 확인하세요'}
              </p>
            </div>

            {/* Locked / Error State */}
            {status !== 'unlocked' && (
              <div className={shaking ? 'shake' : ''}>
                <div className="space-y-4">
                  <Input
                    type="password"
                    value={password}
                    onChange={(e) => {
                      setPassword(e.target.value);
                      if (status === 'error') setStatus('locked');
                    }}
                    onKeyDown={handleKeyDown}
                    placeholder="비밀번호 입력"
                    error={status === 'error'}
                    className="text-center"
                  />

                  {status === 'error' && (
                    <p className="text-red-400 text-sm text-center animate-pulse">
                      {errorHints[Math.min(attempts - 1, errorHints.length - 1)]}
                    </p>
                  )}

                  <Button onClick={handleSubmit} size="lg" className="w-full">
                    <span className="flex items-center justify-center gap-2">
                      <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" />
                      </svg>
                      잠금 해제
                    </span>
                  </Button>
                </div>

                {attempts > 0 && (
                  <p className="text-white/30 text-xs text-center mt-4">
                    시도 횟수: {attempts}회
                  </p>
                )}
              </div>
            )}

            {/* Unlocked State */}
            {status === 'unlocked' && (
              <div className="fade-in-up">
                <div className="bg-gradient-to-r from-emerald-500/20 to-teal-500/20 border border-emerald-400/30 rounded-xl p-6 mb-6">
                  <p className="text-white text-lg sm:text-xl leading-relaxed text-center font-medium">
                    {secretMsg}
                  </p>
                </div>
                <Button onClick={handleReset} variant="secondary" size="md" className="w-full">
                  <span className="flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <polyline points="1 4 1 10 7 10" />
                      <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                    </svg>
                    다시 잠그기
                  </span>
                </Button>
              </div>
            )}

            {/* Dots indicator */}
            <div className="flex justify-center gap-2 mt-8">
              {[0, 1, 2, 3].map((i) => (
                <div
                  key={i}
                  className={`w-3 h-3 rounded-full transition-all duration-500 ${
                    status === 'unlocked'
                      ? 'bg-emerald-400 scale-110'
                      : password.length > i
                      ? 'bg-violet-400 scale-110'
                      : 'bg-white/20'
                  }`}
                />
              ))}
            </div>
          </Card>

        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function App() {
      return <SecretMessageApp />;
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
