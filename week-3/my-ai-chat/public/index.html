<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마음이 - AI 심리상담</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mint: { 50: '#f0fdf9', 100: '#ccfbef', 200: '#99f6db', 300: '#5ceac4', 400: '#2dd4a8', 500: '#14b890', 600: '#0d9473', 700: '#0f765e', 800: '#115e4c', 900: '#134e40' },
            warm: { 50: '#fefce8', 100: '#fef9c3', 200: '#fef08a', 300: '#fde047', 400: '#facc15', 500: '#eab308' }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
    body { font-family: 'Noto Sans KR', sans-serif; }
    .typing-dot { animation: blink 1.4s infinite both; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
    .msg-enter { animation: msgIn 0.3s ease-out; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
  </style>
</head>
<body class="bg-gradient-to-br from-mint-50 via-white to-warm-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    function TypingIndicator() {
      return (
        <div className="flex items-end gap-2 msg-enter">
          <div className="w-8 h-8 rounded-full bg-mint-500 flex items-center justify-center text-white text-sm flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
          </div>
          <div className="bg-white rounded-2xl rounded-bl-md px-4 py-3 shadow-sm">
            <div className="flex gap-1">
              <div className="w-2 h-2 bg-mint-400 rounded-full typing-dot"></div>
              <div className="w-2 h-2 bg-mint-400 rounded-full typing-dot"></div>
              <div className="w-2 h-2 bg-mint-400 rounded-full typing-dot"></div>
            </div>
          </div>
        </div>
      );
    }

    function Message({ msg }) {
      const isUser = msg.role === "user";
      return (
        <div className={`flex items-end gap-2 msg-enter ${isUser ? "flex-row-reverse" : ""}`}>
          {!isUser && (
            <div className="w-8 h-8 rounded-full bg-mint-500 flex items-center justify-center text-white text-sm flex-shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
            </div>
          )}
          <div className={`max-w-[75%] px-4 py-3 shadow-sm whitespace-pre-wrap leading-relaxed text-[15px] ${
            isUser
              ? "bg-mint-500 text-white rounded-2xl rounded-br-md"
              : "bg-white text-gray-800 rounded-2xl rounded-bl-md"
          }`}>
            {msg.content}
          </div>
        </div>
      );
    }

    function App() {
      const [messages, setMessages] = useState([
        { role: "assistant", content: "안녕하세요, 저는 AI 심리상담사 마음이예요.\n오늘 기분은 어떠세요? 편하게 이야기해 주세요." }
      ]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const chatRef = useRef(null);
      const inputRef = useRef(null);
      const sessionId = useRef(Date.now().toString());

      useEffect(() => {
        if (chatRef.current) {
          chatRef.current.scrollTop = chatRef.current.scrollHeight;
        }
      }, [messages, loading]);

      const sendMessage = async () => {
        const text = input.trim();
        if (!text || loading) return;

        setInput("");
        setMessages(prev => [...prev, { role: "user", content: text }]);
        setLoading(true);

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, sessionId: sessionId.current }),
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          setMessages(prev => [...prev, { role: "assistant", content: data.reply }]);
        } catch (err) {
          setMessages(prev => [...prev, { role: "assistant", content: "죄송해요, 잠시 문제가 생겼어요. 다시 말씀해 주시겠어요?" }]);
        } finally {
          setLoading(false);
          inputRef.current?.focus();
        }
      };

      const resetChat = async () => {
        await fetch("/api/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId: sessionId.current }),
        });
        sessionId.current = Date.now().toString();
        setMessages([
          { role: "assistant", content: "안녕하세요, 저는 AI 심리상담사 마음이예요.\n오늘 기분은 어떠세요? 편하게 이야기해 주세요." }
        ]);
      };

      const handleKeyDown = (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      };

      return (
        <div className="flex flex-col h-screen max-w-lg mx-auto">
          {/* Header */}
          <header className="bg-white/80 backdrop-blur-md border-b border-mint-100 px-4 py-3 flex items-center justify-between flex-shrink-0">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-full bg-gradient-to-br from-mint-400 to-mint-600 flex items-center justify-center text-white shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
              </div>
              <div>
                <h1 className="font-bold text-gray-800 text-lg leading-tight">마음이</h1>
                <p className="text-xs text-mint-600">AI 심리상담사</p>
              </div>
            </div>
            <button
              onClick={resetChat}
              className="text-sm text-gray-400 hover:text-mint-600 transition-colors px-3 py-1.5 rounded-lg hover:bg-mint-50"
            >
              새 상담
            </button>
          </header>

          {/* Chat Area */}
          <div ref={chatRef} className="flex-1 overflow-y-auto chat-scroll px-4 py-4 space-y-4">
            {messages.map((msg, i) => (
              <Message key={i} msg={msg} />
            ))}
            {loading && <TypingIndicator />}
          </div>

          {/* Input Area */}
          <div className="flex-shrink-0 bg-white/80 backdrop-blur-md border-t border-mint-100 px-4 py-3">
            <div className="flex items-end gap-2">
              <textarea
                ref={inputRef}
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder="마음속 이야기를 편하게 적어주세요..."
                rows={1}
                className="flex-1 resize-none rounded-2xl border border-gray-200 px-4 py-2.5 text-[15px] focus:outline-none focus:border-mint-400 focus:ring-2 focus:ring-mint-100 transition-all placeholder:text-gray-300"
                style={{ maxHeight: "120px" }}
                onInput={(e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; }}
              />
              <button
                onClick={sendMessage}
                disabled={!input.trim() || loading}
                className="w-10 h-10 rounded-full bg-mint-500 text-white flex items-center justify-center hover:bg-mint-600 disabled:opacity-40 disabled:cursor-not-allowed transition-all shadow-md hover:shadow-lg flex-shrink-0"
              >
                <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
            <p className="text-[11px] text-gray-300 text-center mt-2">AI 상담은 전문 상담을 대체할 수 없습니다. 긴급시 1577-0199</p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
