<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>극비 문서 열람 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #0a0a0f;
    }

    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.97; }
      92% { opacity: 0.9; }
      94% { opacity: 1; }
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }

    @keyframes typewriter {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink-caret {
      from, to { border-color: transparent; }
      50% { border-color: #00ff41; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 5px rgba(0, 255, 65, 0.3), 0 0 10px rgba(0, 255, 65, 0.1); }
      50% { box-shadow: 0 0 15px rgba(0, 255, 65, 0.5), 0 0 30px rgba(0, 255, 65, 0.2); }
    }

    @keyframes reveal {
      0% { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 0 0 0); }
    }

    @keyframes matrix-rain {
      0% { transform: translateY(-100%); opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
      20%, 40%, 60%, 80% { transform: translateX(4px); }
    }

    @keyframes confetti-fall {
      0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    .scanline::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(0, 255, 65, 0.08);
      animation: scanline 4s linear infinite;
      pointer-events: none;
      z-index: 50;
    }

    .flicker {
      animation: flicker 0.15s infinite;
    }

    .shake {
      animation: shake 0.5s ease-in-out;
    }

    .input-glow:focus {
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .matrix-char {
      position: fixed;
      color: #00ff41;
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      animation: matrix-rain 3s linear forwards;
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      pointer-events: none;
      z-index: 100;
      animation: confetti-fall 3s ease-out forwards;
    }

    .secret-reveal {
      animation: fadeInUp 0.8s ease-out forwards;
    }

    .top-secret-stamp {
      animation: fadeInUp 0.6s ease-out 0.3s both;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ========================================
    // Design System Components
    // ========================================

    function Button({ children, onClick, variant = 'primary', size = 'md', disabled = false, className = '', ...props }) {
      const baseClasses = 'font-bold uppercase tracking-widest transition-all duration-300 border-2 font-orbitron';
      const variants = {
        primary: 'bg-green-900/30 border-green-500 text-green-400 hover:bg-green-500/20 hover:shadow-[0_0_20px_rgba(0,255,65,0.3)] disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-green-900/30 disabled:hover:shadow-none',
        danger: 'bg-red-900/30 border-red-500 text-red-400 hover:bg-red-500/20 hover:shadow-[0_0_20px_rgba(255,0,0,0.3)]',
        ghost: 'bg-transparent border-gray-600 text-gray-400 hover:border-gray-400 hover:text-gray-300',
      };
      const sizes = {
        sm: 'px-4 py-2 text-xs',
        md: 'px-8 py-3 text-sm',
        lg: 'px-12 py-4 text-base',
      };

      return (
        <button
          onClick={onClick}
          disabled={disabled}
          className={`${baseClasses} ${variants[variant]} ${sizes[size]} ${className}`}
          {...props}
        >
          {children}
        </button>
      );
    }

    function Input({ type = 'text', value, onChange, placeholder, error, disabled, className = '', onKeyDown, inputRef }) {
      return (
        <input
          ref={inputRef}
          type={type}
          value={value}
          onChange={onChange}
          onKeyDown={onKeyDown}
          placeholder={placeholder}
          disabled={disabled}
          className={`w-full bg-black/60 border-2 ${error ? 'border-red-500' : 'border-green-800'} text-green-400 px-5 py-4 text-lg tracking-wider focus:outline-none focus:border-green-400 input-glow transition-all duration-300 placeholder-green-900 font-mono ${className}`}
          autoComplete="off"
        />
      );
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`bg-gray-900/80 border border-green-900/50 backdrop-blur-sm shadow-2xl ${className}`}>
          {children}
        </div>
      );
    }

    // ========================================
    // Matrix Rain Background
    // ========================================

    function MatrixRain({ active }) {
      const [chars, setChars] = useState([]);
      const intervalRef = useRef(null);

      useEffect(() => {
        if (!active) {
          setChars([]);
          return;
        }

        const matrixChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';
        intervalRef.current = setInterval(() => {
          const newChar = {
            id: Date.now() + Math.random(),
            char: matrixChars[Math.floor(Math.random() * matrixChars.length)],
            left: Math.random() * 100,
            delay: Math.random() * 2,
            duration: 2 + Math.random() * 3,
          };
          setChars(prev => [...prev.slice(-40), newChar]);
        }, 80);

        return () => clearInterval(intervalRef.current);
      }, [active]);

      return (
        <>
          {chars.map(c => (
            <span
              key={c.id}
              className="matrix-char"
              style={{
                left: `${c.left}%`,
                animationDelay: `${c.delay}s`,
                animationDuration: `${c.duration}s`,
              }}
            >
              {c.char}
            </span>
          ))}
        </>
      );
    }

    // ========================================
    // Confetti Effect
    // ========================================

    function Confetti({ active }) {
      const [pieces, setPieces] = useState([]);

      useEffect(() => {
        if (!active) return;
        const colors = ['#ff0000', '#00ff41', '#ffff00', '#ff00ff', '#00ffff', '#ff8800', '#ffffff'];
        const newPieces = Array.from({ length: 60 }, (_, i) => ({
          id: i,
          left: Math.random() * 100,
          color: colors[Math.floor(Math.random() * colors.length)],
          delay: Math.random() * 1.5,
          duration: 2 + Math.random() * 2,
          size: 6 + Math.random() * 8,
          shape: Math.random() > 0.5 ? 'circle' : 'square',
        }));
        setPieces(newPieces);
      }, [active]);

      if (!active) return null;

      return (
        <>
          {pieces.map(p => (
            <div
              key={p.id}
              className="confetti"
              style={{
                left: `${p.left}%`,
                width: `${p.size}px`,
                height: `${p.size}px`,
                backgroundColor: p.color,
                borderRadius: p.shape === 'circle' ? '50%' : '2px',
                animationDelay: `${p.delay}s`,
                animationDuration: `${p.duration}s`,
              }}
            />
          ))}
        </>
      );
    }

    // ========================================
    // Typing Effect Component
    // ========================================

    function TypingText({ text, speed = 60, onComplete, className = '' }) {
      const [displayed, setDisplayed] = useState('');
      const [done, setDone] = useState(false);

      useEffect(() => {
        let i = 0;
        const timer = setInterval(() => {
          if (i < text.length) {
            setDisplayed(text.slice(0, i + 1));
            i++;
          } else {
            clearInterval(timer);
            setDone(true);
            if (onComplete) onComplete();
          }
        }, speed);
        return () => clearInterval(timer);
      }, [text, speed]);

      return (
        <span className={className}>
          {displayed}
          {!done && <span className="inline-block w-0.5 h-5 bg-green-400 ml-1 animate-pulse" />}
        </span>
      );
    }

    // ========================================
    // Access Denied Component
    // ========================================

    function AccessDenied({ attempts }) {
      return (
        <div className="text-center mt-4">
          <p className="text-red-500 text-sm font-mono tracking-wider animate-pulse">
            ACCESS DENIED - {attempts > 1 ? `${attempts}` : ''}
          </p>
          <div className="mt-2 flex justify-center gap-1">
            {[...Array(5)].map((_, i) => (
              <div
                key={i}
                className={`w-2 h-2 rounded-full transition-all duration-300 ${
                  i < attempts ? 'bg-red-500 shadow-[0_0_6px_rgba(255,0,0,0.6)]' : 'bg-gray-700'
                }`}
              />
            ))}
          </div>
          {attempts >= 3 && (
            <p className="text-yellow-500/70 text-xs mt-3 font-mono">
              WARNING: {5 - attempts}
            </p>
          )}
        </div>
      );
    }

    // ========================================
    // Secret Message Component
    // ========================================

    function SecretMessage() {
      const [step, setStep] = useState(0);

      useEffect(() => {
        const timers = [
          setTimeout(() => setStep(1), 300),
          setTimeout(() => setStep(2), 1200),
          setTimeout(() => setStep(3), 2500),
        ];
        return () => timers.forEach(clearTimeout);
      }, []);

      return (
        <div className="text-center space-y-8">
          {step >= 0 && (
            <div className="top-secret-stamp">
              <div className="inline-block border-4 border-red-500 px-6 py-2 transform -rotate-6 shadow-[0_0_20px_rgba(255,0,0,0.3)]">
                <span className="font-orbitron text-red-500 text-2xl font-black tracking-[0.3em]">
                  TOP SECRET
                </span>
              </div>
            </div>
          )}

          {step >= 1 && (
            <div className="secret-reveal space-y-4">
              <div className="text-green-400/60 text-xs font-mono tracking-widest uppercase">
                <TypingText text="// CLASSIFIED DOCUMENT - LEVEL 5 CLEARANCE //" speed={30} />
              </div>
            </div>
          )}

          {step >= 2 && (
            <div className="secret-reveal">
              <Card className="p-8 mx-auto max-w-lg border-green-500/30 relative overflow-hidden">
                <div className="absolute inset-0 bg-gradient-to-br from-green-500/5 to-transparent" />
                <div className="relative z-10">
                  <div className="text-5xl mb-6">
                    <span role="img" aria-label="celebration">&#127881;&#127882;&#128640;</span>
                  </div>
                  <h2 className="text-green-300 text-2xl font-bold mb-4">
                    <TypingText
                      text="&#52629;&#54616;&#54633;&#45768;&#45796;! &#48708;&#48128; &#47700;&#49884;&#51648;&#47484; &#48156;&#44204;&#54664;&#49845;&#45768;&#45796;!"
                      speed={50}
                    />
                  </h2>
                  <div className="h-px bg-gradient-to-r from-transparent via-green-500/50 to-transparent my-4" />
                  <p className="text-green-400/80 text-base leading-relaxed mb-4">
                    &#45817;&#49888;&#51008; &#51652;&#51221;&#54620; &#50644;&#47532;&#53944; &#50836;&#50896;&#51077;&#45768;&#45796;.
                  </p>
                  <p className="text-green-400/80 text-base leading-relaxed mb-4">
                    &#51060; &#47700;&#49884;&#51648;&#47484; &#52286;&#50500;&#45240; &#45817;&#49888;&#50640;&#44172;<br />
                    &#53945;&#48324;&#54620; &#51076;&#47924;&#47484; &#48512;&#50668;&#54633;&#45768;&#45796;:
                  </p>
                  <div className="bg-black/50 border border-green-500/20 p-4 rounded mt-4">
                    <p className="text-yellow-400 font-mono text-sm">
                      MISSION: &#50724;&#45720;&#46020; &#51600;&#44144;&#50868; &#54616;&#47336;&#47484; &#48372;&#45236;&#49464;&#50836;! &#128526;
                    </p>
                  </div>
                </div>
              </Card>

              {step >= 3 && (
                <div className="secret-reveal mt-6 space-y-2">
                  <p className="text-green-600/50 text-xs font-mono">
                    DOCUMENT ID: AFM-2026-SECRET-{Math.random().toString(36).substr(2, 8).toUpperCase()}
                  </p>
                  <p className="text-green-600/30 text-xs font-mono">
                    DECRYPTED AT: {new Date().toLocaleString('ko-KR')}
                  </p>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ========================================
    // Page Component - Login Terminal
    // ========================================

    function LoginTerminal() {
      const [password, setPassword] = useState('');
      const [status, setStatus] = useState('idle'); // idle, checking, denied, granted
      const [attempts, setAttempts] = useState(0);
      const [shaking, setShaking] = useState(false);
      const [showMatrix, setShowMatrix] = useState(false);
      const [showConfetti, setShowConfetti] = useState(false);
      const [currentTime, setCurrentTime] = useState(new Date());
      const inputRef = useRef(null);
      const locked = attempts >= 5 && status !== 'granted';

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (inputRef.current && status === 'idle') {
          inputRef.current.focus();
        }
      }, [status]);

      const handleSubmit = useCallback(() => {
        if (!password.trim() || status === 'checking' || locked) return;

        setStatus('checking');

        setTimeout(() => {
          if (password === '1234') {
            setStatus('granted');
            setShowMatrix(true);
            setTimeout(() => setShowConfetti(true), 500);
            setTimeout(() => setShowMatrix(false), 3000);
          } else {
            setStatus('denied');
            setAttempts(prev => prev + 1);
            setShaking(true);
            setTimeout(() => setShaking(false), 500);
            setTimeout(() => {
              setStatus('idle');
              setPassword('');
              if (inputRef.current) inputRef.current.focus();
            }, 1500);
          }
        }, 800 + Math.random() * 600);
      }, [password, status, locked]);

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') handleSubmit();
      };

      return (
        <div className="min-h-screen bg-[#0a0a0f] text-green-400 relative overflow-hidden scanline">
          <MatrixRain active={showMatrix} />
          <Confetti active={showConfetti} />

          {/* Background grid */}
          <div
            className="fixed inset-0 opacity-[0.03] pointer-events-none"
            style={{
              backgroundImage: 'linear-gradient(rgba(0,255,65,1) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,65,1) 1px, transparent 1px)',
              backgroundSize: '40px 40px',
            }}
          />

          {/* Top bar */}
          <div className="relative z-10 border-b border-green-900/40 bg-black/40 backdrop-blur-sm">
            <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_rgba(0,255,65,0.6)] animate-pulse" />
                <span className="font-orbitron text-xs text-green-600 tracking-[0.2em]">
                  SECURE TERMINAL v3.1
                </span>
              </div>
              <div className="font-mono text-xs text-green-700">
                {currentTime.toLocaleString('ko-KR')}
              </div>
            </div>
          </div>

          {/* Main content */}
          <div className="relative z-10 flex items-center justify-center min-h-[calc(100vh-52px)] px-4 py-8">
            <div className="w-full max-w-md">
              {status !== 'granted' ? (
                <div className={shaking ? 'shake' : ''}>
                  {/* Header */}
                  <div className="text-center mb-10">
                    <div className="inline-block mb-6">
                      <svg className="w-16 h-16 mx-auto text-green-500/60" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                      </svg>
                    </div>
                    <h1 className="font-orbitron text-2xl font-bold tracking-[0.15em] text-green-300 mb-2 flicker">
                      CLASSIFIED
                    </h1>
                    <p className="text-green-600/80 text-sm font-mono tracking-wider">
                      &#51064;&#44032;&#46108; &#50836;&#50896;&#47564; &#51217;&#44540; &#44032;&#45733;&#54633;&#45768;&#45796;
                    </p>
                  </div>

                  {/* Login form */}
                  <Card className="p-8">
                    <div className="space-y-6">
                      <div>
                        <label className="block text-xs font-mono text-green-600 tracking-[0.2em] uppercase mb-3">
                          ACCESS CODE
                        </label>
                        <Input
                          type="password"
                          value={password}
                          onChange={(e) => setPassword(e.target.value)}
                          onKeyDown={handleKeyDown}
                          placeholder="&#48708;&#48128;&#48264;&#54840;&#47484; &#51077;&#47141;&#54616;&#49464;&#50836;"
                          error={status === 'denied'}
                          disabled={status === 'checking' || locked}
                          inputRef={inputRef}
                        />
                      </div>

                      <Button
                        onClick={handleSubmit}
                        disabled={!password.trim() || status === 'checking' || locked}
                        size="lg"
                        className="w-full"
                      >
                        {status === 'checking' ? (
                          <span className="flex items-center justify-center gap-3">
                            <svg className="animate-spin w-5 h-5" viewBox="0 0 24 24" fill="none">
                              <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                              <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
                            </svg>
                            DECRYPTING...
                          </span>
                        ) : locked ? (
                          'SYSTEM LOCKED'
                        ) : (
                          'AUTHENTICATE'
                        )}
                      </Button>

                      {attempts > 0 && status !== 'checking' && (
                        <AccessDenied attempts={attempts} />
                      )}

                      {locked && (
                        <div className="text-center">
                          <p className="text-red-400 text-xs font-mono animate-pulse">
                            &#52572;&#45824; &#49884;&#46020; &#54943;&#49688;&#47484; &#52488;&#44284;&#54664;&#49845;&#45768;&#45796;.
                          </p>
                          <button
                            onClick={() => { setAttempts(0); setStatus('idle'); setPassword(''); }}
                            className="text-green-700 text-xs font-mono mt-2 underline hover:text-green-500 transition-colors"
                          >
                            &#49884;&#49828;&#53596; &#52488;&#44592;&#54868;
                          </button>
                        </div>
                      )}
                    </div>
                  </Card>

                  {/* Footer hint */}
                  <div className="text-center mt-8">
                    <p className="text-green-900/60 text-xs font-mono">
                      HINT: &#44032;&#51109; &#44036;&#45800;&#54620; &#49707;&#51088; &#51312;&#54633;&#51012; &#49884;&#46020;&#54644;&#48372;&#49464;&#50836;
                    </p>
                  </div>
                </div>
              ) : (
                <SecretMessage />
              )}
            </div>
          </div>

          {/* Bottom status bar */}
          <div className="fixed bottom-0 left-0 right-0 z-10 border-t border-green-900/30 bg-black/60 backdrop-blur-sm">
            <div className="max-w-4xl mx-auto px-4 py-2 flex items-center justify-between">
              <span className="text-xs font-mono text-green-900">
                {status === 'granted' ? 'STATUS: ACCESS GRANTED' : `STATUS: AWAITING AUTHENTICATION`}
              </span>
              <span className="text-xs font-mono text-green-900">
                ENCRYPTION: AES-256
              </span>
            </div>
          </div>
        </div>
      );
    }

    // ========================================
    // App Component
    // ========================================

    function App() {
      return <LoginTerminal />;
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
