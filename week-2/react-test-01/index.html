<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Style Navigation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #000; color: #fff; }

    .nav-blur {
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }

    .mega-menu-enter {
      animation: megaMenuIn 0.3s ease forwards;
    }
    .mega-menu-exit {
      animation: megaMenuOut 0.2s ease forwards;
    }

    @keyframes megaMenuIn {
      from { opacity: 0; max-height: 0; }
      to { opacity: 1; max-height: 500px; }
    }
    @keyframes megaMenuOut {
      from { opacity: 1; max-height: 500px; }
      to { opacity: 0; max-height: 0; }
    }

    .mobile-menu-enter {
      animation: slideDown 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .mobile-menu-exit {
      animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-10px); }
    }

    .hero-gradient {
      background: radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, #000 70%);
    }

    .card-shine {
      background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 50%, #1a1a1a 100%);
    }
    .card-shine:hover {
      background: linear-gradient(135deg, #1f1f1f 0%, #333 50%, #1f1f1f 100%);
    }

    .fade-in {
      animation: fadeIn 0.8s ease forwards;
      opacity: 0;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .hamburger-line {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'apple-gray': {
              100: '#f5f5f7',
              200: '#d2d2d7',
              300: '#86868b',
              400: '#6e6e73',
              500: '#424245',

            'apple-blue-hover': '#0077ed',

  </script>
</head>

      </svg>

    const BagIcon = () => (

    // ========================================
    // Hamburger Button Component
    // ========================================
    const HamburgerButton = ({ isOpen, onClick }) => (

      </button>
    );

    // ========================================
    // Mega Menu Component (Desktop)
    // ========================================
    const MegaMenu = ({ item, isVisible }) => {
      if (!item) return null;

      return (
        <div className={`absolute top-full left-0 w-full nav-blur overflow-hidden ${isVisible ? 'mega-menu-enter' : 'mega-menu-exit'}`}
             style={{ backgroundColor: 'rgba(29,29,31,0.95)' }}>
          <div className="max-w-[980px] mx-auto px-6 py-10">

              {item.links.map((section, i) => (

                  <h3 className="text-xs text-apple-gray-300 font-semibold mb-3 uppercase tracking-wider">{section.heading}</h3>
                  <ul className="space-y-2">
                    {section.items.map((link, j) => (
                      <li key={j}>
                        <a href="#" className={`block transition-colors duration-200 hover:text-white ${j === 0 && i === 0 ? 'text-2xl font-bold text-white hover:text-apple-blue' : 'text-sm text-apple-gray-200 hover:text-white'}`}>
                          {link}
                        </a>
                      </li>
                    ))}
                  </ul>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // ========================================
    // Mobile Menu Component
    // ========================================
    const MobileMenu = ({ isOpen, items }) => {
      const [expandedItem, setExpandedItem] = useState(null);

      if (!isOpen) return null;

      return (
        <div className="lg:hidden fixed inset-0 top-[44px] z-40 overflow-y-auto mobile-menu-enter"
             style={{ backgroundColor: 'rgba(0,0,0,0.97)' }}>

                    {item.label}
                    <svg className={`w-3 h-3 fill-apple-gray-300 transition-transform duration-300 ${expandedItem === idx ? 'rotate-90' : ''}`} viewBox="0 0 10 16">

                  </button>
                  {expandedItem === idx && (
                    <div className="pb-4 pl-2 fade-in">
                      {item.links.map((section, si) => (
                        <div key={si} className="mb-3">

    // ========================================
    // Header / Navigation Component
    // ========================================
    const Header = () => {
      const [activeMenu, setActiveMenu] = useState(null);
      const [menuVisible, setMenuVisible] = useState(false);
      const [mobileOpen, setMobileOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);
      const timeoutRef = useRef(null);

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 10);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // Lock body scroll when mobile menu open
      useEffect(() => {
        document.body.style.overflow = mobileOpen ? 'hidden' : '';
        return () => { document.body.style.overflow = ''; };
      }, [mobileOpen]);

      const handleMouseEnter = useCallback((idx) => {
        clearTimeout(timeoutRef.current);
        setActiveMenu(idx);
        setMenuVisible(true);
      }, []);

      const handleMouseLeave = useCallback(() => {
        timeoutRef.current = setTimeout(() => {
          setMenuVisible(false);
          setTimeout(() => setActiveMenu(null), 200);
        }, 150);
      }, []);

      return (
        <header className={`fixed top-0 left-0 right-0 z-50 nav-blur transition-all duration-300 ${scrolled ? 'shadow-lg' : ''}`}

          {/* Main Nav Bar */}
          <nav className="max-w-[980px] mx-auto h-[44px] flex items-center justify-between px-4 lg:px-0">

            {/* Desktop Nav Items */}
            <div className="hidden lg:flex items-center gap-0 flex-1 justify-center">

                  key={idx}
                  href="#"
                  className={`px-3 py-2 text-[12px] transition-colors duration-200 ${activeMenu === idx ? 'text-white' : 'text-apple-gray-200 hover:text-white'}`}
                  onMouseEnter={() => handleMouseEnter(idx)}
                  onMouseLeave={handleMouseLeave}

                  {item.label}

              ))}
            </div>

            {/* Right Icons */}
            <div className="flex items-center gap-4">
              <SearchIcon />
              <BagIcon />
              <HamburgerButton isOpen={mobileOpen} onClick={() => setMobileOpen(!mobileOpen)} />
            </div>
          </nav>

          {/* Desktop Mega Menu */}
          <div className="hidden lg:block"
               onMouseEnter={() => { clearTimeout(timeoutRef.current); }}
               onMouseLeave={handleMouseLeave}>
            {activeMenu !== null && (
              <MegaMenu item={NAV_ITEMS[activeMenu]} isVisible={menuVisible} />
            )}
          </div>

          {/* Overlay for mega menu */}
          {menuVisible && activeMenu !== null && (
            <div className="hidden lg:block fixed inset-0 top-[44px] bg-black/50 -z-10" onMouseEnter={handleMouseLeave} />
          )}

          {/* Mobile Menu */}
          <MobileMenu isOpen={mobileOpen} items={NAV_ITEMS} />
        </header>
      );
    };

    // ========================================

    // ========================================
    const HeroSection = () => (
      <section className="hero-gradient pt-[44px]">
        <div className="flex flex-col items-center justify-center text-center px-4 py-20 md:py-32 lg:py-40">

          <p className="text-apple-gray-200 text-lg md:text-xl mb-2 fade-in" style={{ animationDelay: '0.6s' }}>Apple Intelligence</p>

          <div className="flex items-center gap-6 fade-in" style={{ animationDelay: '0.8s' }}>
            <a href="#" className="text-apple-blue hover:text-apple-blue-hover text-lg transition-colors">

            </a>
            <a href="#" className="text-apple-blue hover:text-apple-blue-hover text-lg transition-colors">
              구입하기 &gt;
            </a>
          </div>

          {/* Hero placeholder */}
          <div className="mt-12 w-full max-w-3xl aspect-[16/9] rounded-3xl overflow-hidden fade-in" style={{ animationDelay: '1s' }}>
            <div className="w-full h-full bg-gradient-to-b from-apple-gray-700 to-apple-gray-900 flex items-center justify-center">
              <div className="text-center">
                <div className="text-8xl md:text-9xl mb-4 opacity-20">&#9679;</div>
                <p className="text-apple-gray-400 text-sm">iPhone 16 Pro Hero Image</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    );

    // ========================================
    // Banner Section Component
    // ========================================
    const BannerSection = () => (
      <section className="bg-apple-gray-900 border-t border-apple-gray-600/30">
        <div className="max-w-[980px] mx-auto text-center py-16 md:py-20 px-4">
          <h2 className="text-3xl md:text-5xl font-bold mb-3">MacBook Air</h2>
          <p className="text-xl md:text-2xl text-apple-gray-200 mb-2">가벼움, 그 이상의 능력.</p>
          <p className="text-apple-gray-300 mb-6">M3 칩 탑재. 1,390,000원부터</p>
          <div className="flex items-center justify-center gap-6">

    const ProductCard = ({ product, index }) => (

        <div className="w-full aspect-[4/3] bg-gradient-to-b from-white/5 to-transparent rounded-xl mb-6 flex items-center justify-center">

        <h3 className="text-xl font-bold text-white mb-1">{product.name}</h3>
        <p className="text-lg text-apple-gray-200 mb-2">{product.tagline}</p>

            * Apple Intelligence은 M1 이상의 칩이 탑재된 iPhone, iPad 및 Mac에서 사용할 수 있으며, Siri 및 기기 언어가 지원되는 언어로 설정되어 있어야 합니다. 자세한 내용은 apple.com/kr/apple-intelligence에서 확인할 수 있습니다.

          <div className="border-t border-apple-gray-600/30 pt-6">

              {['쇼핑 및 알아보기', 'Apple Store', 'Apple 계정', 'Apple 가치관', 'Apple 정보'].map((title, i) => (

                    {['링크 1', '링크 2', '링크 3', '링크 4'].map((link, j) => (

          <div className="border-t border-apple-gray-600/30 pt-4 flex flex-col md:flex-row items-center justify-between gap-2">

            <div className="flex items-center gap-3 text-xs text-apple-gray-400">

              <a href="#" className="hover:text-white transition-colors">약관</a>

              <a href="#" className="hover:text-white transition-colors">사이트 맵</a>

    // ========================================
    // App Component

    const App = () => (
      <div className="min-h-screen bg-black">
        <Header />
        <main>
          <HeroSection />
          <BannerSection />
          <ProductGrid />
        </main>
        <Footer />
      </div>
    );

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
