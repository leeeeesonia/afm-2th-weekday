<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>짤 생성기 - Korean Meme Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans KR', sans-serif; }
    .bubble-carousel::-webkit-scrollbar { height: 6px; }
    .bubble-carousel::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 3px; }
    .bubble-carousel::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
    .drop-zone-active { border-color: #6366f1 !important; background: rgba(99,102,241,0.08) !important; }
    @keyframes pop { 0% { transform: scale(0.95); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    .pop-in { animation: pop 0.25s ease-out; }
    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-3deg); }
      75% { transform: rotate(3deg); }
    }
    .shake { animation: shake 0.4s ease-in-out; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f0ff', 100: '#e0e0ff', 200: '#c4b5fd', 300: '#a78bfa', 400: '#8b5cf6', 500: '#7c3aed', 600: '#6d28d9', 700: '#5b21b6' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks Destructuring
    // ========================================
    const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React;

    // ========================================
    // Constants & Helpers
    // ========================================
    const CANVAS_W = 600;
    const CANVAS_H = 600;

    const BUBBLE_TYPES = [
      { id: 'none', name: '없음', icon: 'Aa' },
      { id: 'standard', name: '기본 말풍선', icon: '💬' },
      { id: 'thought', name: '생각 말풍선', icon: '💭' },
      { id: 'shout', name: '외침 말풍선', icon: '💥' },
      { id: 'rect', name: '사각형', icon: '▬' },
      { id: 'rounded', name: '둥근 사각형', icon: '▢' },
      { id: 'cloud', name: '구름형', icon: '☁' },
      { id: 'star', name: '별모양', icon: '✦' },
    ];

    const RANDOM_COLORS = [
      '#ffffff', '#fff9c4', '#ffe0b2', '#f8bbd0', '#c8e6c9',
      '#b3e5fc', '#d1c4e9', '#ffccbc', '#e0f7fa', '#f3e5f5',
    ];

    function generateId() {
      return Math.random().toString(36).substr(2, 9);
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function wrapText(ctx, text, maxWidth) {
      const words = text.split('');
      const lines = [];
      let currentLine = '';
      for (const char of words) {
        const testLine = currentLine + char;
        if (ctx.measureText(testLine).width > maxWidth && currentLine.length > 0) {
          lines.push(currentLine);
          currentLine = char;
        } else {
          currentLine = testLine;
        }
      }
      if (currentLine) lines.push(currentLine);
      return lines.length > 0 ? lines : [''];
    }

    function getTimestamp() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
    }

    // ========================================
    // Bubble Drawing Functions (Canvas 2D)
    // ========================================
    function drawBubble(ctx, type, x, y, w, h, color, opacity) {
      ctx.save();
      ctx.fillStyle = hexToRgba(color, opacity);
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 2;

      const tailH = 20;
      const tailW = 16;

      switch (type) {
        case 'standard': {
          const rx = w / 2, ry = h / 2;
          const cx = x + rx, cy = y + ry;
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          // tail
          ctx.beginPath();
          ctx.moveTo(cx - tailW / 2, y + h - 4);
          ctx.lineTo(cx, y + h + tailH);
          ctx.lineTo(cx + tailW / 2, y + h - 4);
          ctx.fill();
          ctx.stroke();
          break;
        }
        case 'thought': {
          const rx = w / 2, ry = h / 2;
          const cx = x + rx, cy = y + ry;
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          // thought dots
          for (let i = 0; i < 3; i++) {
            const dr = 6 - i * 1.5;
            const dx = cx - 10 + i * 8;
            const dy = y + h + 6 + i * 10;
            ctx.beginPath();
            ctx.arc(dx, dy, dr, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          }
          break;
        }
        case 'shout': {
          const cx = x + w / 2, cy = y + h / 2;
          const points = 12;
          ctx.beginPath();
          for (let i = 0; i < points * 2; i++) {
            const angle = (Math.PI * 2 * i) / (points * 2) - Math.PI / 2;
            const r = i % 2 === 0
              ? Math.max(w, h) / 2 + 12
              : Math.min(w, h) / 2 - 4;
            const px = cx + Math.cos(angle) * (i % 2 === 0 ? (w / 2 + 14) : (w / 2 - 8));
            const py = cy + Math.sin(angle) * (i % 2 === 0 ? (h / 2 + 14) : (h / 2 - 8));
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          break;
        }
        case 'rect': {
          ctx.fillRect(x, y, w, h);
          ctx.strokeRect(x, y, w, h);
          // tail
          ctx.beginPath();
          ctx.moveTo(x + w / 2 - tailW / 2, y + h);
          ctx.lineTo(x + w / 2, y + h + tailH);
          ctx.lineTo(x + w / 2 + tailW / 2, y + h);
          ctx.fill();
          ctx.stroke();
          break;
        }
        case 'rounded': {
          const r = 16;
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r);
          ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + w / 2 + tailW / 2, y + h);
          ctx.lineTo(x + w / 2, y + h + tailH);
          ctx.lineTo(x + w / 2 - tailW / 2, y + h);
          ctx.lineTo(x + r, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          break;
        }
        case 'cloud': {
          const cx = x + w / 2, cy = y + h / 2;
          const numBumps = 10;
          ctx.beginPath();
          for (let i = 0; i < numBumps; i++) {
            const angle = (Math.PI * 2 * i) / numBumps;
            const bx = cx + Math.cos(angle) * (w / 2 - 6);
            const by = cy + Math.sin(angle) * (h / 2 - 6);
            ctx.moveTo(bx + 16, by);
            ctx.arc(bx, by, 16, 0, Math.PI * 2);
          }
          // center fill
          ctx.ellipse(cx, cy, w / 2 - 10, h / 2 - 10, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,0.15)';
          ctx.stroke();
          break;
        }
        case 'star': {
          const cx = x + w / 2, cy = y + h / 2;
          const spikes = 8;
          const outerRadius = Math.max(w, h) / 2 + 10;
          const innerRadius = Math.min(w, h) / 2 - 4;
          ctx.beginPath();
          for (let i = 0; i < spikes * 2; i++) {
            const angle = (Math.PI * 2 * i) / (spikes * 2) - Math.PI / 2;
            const r = i % 2 === 0 ? outerRadius : innerRadius;
            const px = cx + Math.cos(angle) * r;
            const py = cy + Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          break;
        }
        default:
          break;
      }
      ctx.restore();
    }

    // ========================================
    // Design System Components
    // ========================================
    function Button({ children, onClick, variant = 'primary', size = 'md', disabled = false, className = '', ...props }) {
      const base = 'font-semibold rounded-xl transition-all duration-150 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed inline-flex items-center justify-center gap-2';
      const variants = {
        primary: 'bg-brand-500 hover:bg-brand-600 text-white shadow-md shadow-brand-200',
        secondary: 'bg-white hover:bg-gray-50 text-gray-700 border border-gray-200 shadow-sm',
        danger: 'bg-red-500 hover:bg-red-600 text-white shadow-md shadow-red-200',
        ghost: 'bg-transparent hover:bg-gray-100 text-gray-600',
        fun: 'bg-gradient-to-r from-pink-500 to-orange-400 hover:from-pink-600 hover:to-orange-500 text-white shadow-lg shadow-pink-200',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-sm',
        md: 'px-4 py-2 text-sm',
        lg: 'px-6 py-3 text-base',
      };
      return (
        <button onClick={onClick} disabled={disabled}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...props}>
          {children}
        </button>
      );
    }

    function Card({ children, className = '' }) {
      return <div className={`bg-white rounded-2xl shadow-sm border border-gray-100 ${className}`}>{children}</div>;
    }

    function Tooltip({ text, children }) {
      return (
        <div className="relative group inline-block">
          {children}
          <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-2 py-1 text-xs bg-gray-800 text-white rounded-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50">
            {text}
            <div className="absolute top-full left-1/2 -translate-x-1/2 -mt-1 border-4 border-transparent border-t-gray-800" />
          </div>
        </div>
      );
    }

    // ========================================
    // Bubble Carousel Component
    // ========================================
    function BubbleCarousel({ selected, onSelect }) {
      const scrollRef = useRef(null);

      const scroll = (dir) => {
        if (scrollRef.current) {
          scrollRef.current.scrollBy({ left: dir * 120, behavior: 'smooth' });
        }
      };

      // Draw mini bubble preview on a tiny canvas
      const BubblePreview = ({ type }) => {
        const miniRef = useRef(null);
        useEffect(() => {
          const cvs = miniRef.current;
          if (!cvs) return;
          const ctx = cvs.getContext('2d');
          ctx.clearRect(0, 0, 60, 50);
          if (type.id === 'none') {
            ctx.fillStyle = '#64748b';
            ctx.font = 'bold 16px Noto Sans KR';
            ctx.textAlign = 'center';
            ctx.fillText('Aa', 30, 30);
          } else {
            drawBubble(ctx, type.id, 8, 6, 44, 28, '#e2e8f0', 1);
          }
        }, [type]);
        return <canvas ref={miniRef} width={60} height={50} className="w-[60px] h-[50px]" />;
      };

      return (
        <div className="relative">
          <button onClick={() => scroll(-1)}
            className="absolute left-0 top-1/2 -translate-y-1/2 z-10 w-7 h-7 bg-white shadow-md rounded-full flex items-center justify-center text-gray-500 hover:text-brand-500 hover:shadow-lg transition-all">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div ref={scrollRef} className="bubble-carousel flex gap-2 overflow-x-auto px-8 py-2 scroll-smooth">
            {BUBBLE_TYPES.map(type => (
              <button key={type.id} onClick={() => onSelect(type.id)}
                className={`flex-shrink-0 flex flex-col items-center gap-1 p-2 rounded-xl border-2 transition-all ${
                  selected === type.id
                    ? 'border-brand-400 bg-brand-50 shadow-md'
                    : 'border-gray-200 bg-white hover:border-gray-300'
                }`}>
                <BubblePreview type={type} />
                <span className="text-[11px] font-medium text-gray-600 whitespace-nowrap">{type.name}</span>
              </button>
            ))}
          </div>
          <button onClick={() => scroll(1)}
            className="absolute right-0 top-1/2 -translate-y-1/2 z-10 w-7 h-7 bg-white shadow-md rounded-full flex items-center justify-center text-gray-500 hover:text-brand-500 hover:shadow-lg transition-all">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
      );
    }

    // ========================================
    // Text Item Component
    // ========================================
    function TextItem({ item, onChange, onDelete }) {
      return (
        <Card className="p-3 pop-in">
          <div className="flex items-start gap-2">
            <div className="flex-1 space-y-2">
              <input type="text" value={item.text} onChange={e => onChange({ ...item, text: e.target.value })}
                className="w-full px-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-300 focus:border-transparent"
                placeholder="텍스트 입력..." />
              <div className="flex flex-wrap items-center gap-2">
                <Tooltip text="글자 크기">
                  <div className="flex items-center gap-1">
                    <span className="text-[10px] text-gray-400">A</span>
                    <input type="range" min="12" max="72" value={item.fontSize}
                      onChange={e => onChange({ ...item, fontSize: parseInt(e.target.value) })}
                      className="w-16 h-1 accent-brand-500" />
                    <span className="text-xs text-gray-500 w-6">{item.fontSize}</span>
                  </div>
                </Tooltip>
                <Tooltip text="글자 색상">
                  <input type="color" value={item.color} onChange={e => onChange({ ...item, color: e.target.value })}
                    className="w-7 h-7 rounded border border-gray-200 cursor-pointer" />
                </Tooltip>
                <Tooltip text="굵게">
                  <button onClick={() => onChange({ ...item, bold: !item.bold })}
                    className={`w-7 h-7 rounded text-sm font-bold flex items-center justify-center transition ${item.bold ? 'bg-brand-100 text-brand-600' : 'bg-gray-100 text-gray-400'}`}>
                    B
                  </button>
                </Tooltip>
                <Tooltip text="기울임">
                  <button onClick={() => onChange({ ...item, italic: !item.italic })}
                    className={`w-7 h-7 rounded text-sm italic flex items-center justify-center transition ${item.italic ? 'bg-brand-100 text-brand-600' : 'bg-gray-100 text-gray-400'}`}>
                    I
                  </button>
                </Tooltip>
                <Tooltip text="외곽선">
                  <button onClick={() => onChange({ ...item, stroke: !item.stroke })}
                    className={`w-7 h-7 rounded text-[10px] font-bold flex items-center justify-center transition ${item.stroke ? 'bg-brand-100 text-brand-600' : 'bg-gray-100 text-gray-400'}`}>
                    S
                  </button>
                </Tooltip>
              </div>
            </div>
            <button onClick={onDelete}
              className="w-7 h-7 rounded-lg bg-red-50 hover:bg-red-100 text-red-400 hover:text-red-600 flex items-center justify-center transition text-lg">
              &times;
            </button>
          </div>
        </Card>
      );
    }

    // ========================================
    // Main App Component
    // ========================================
    function App() {
      const canvasRef = useRef(null);
      const fileInputRef = useRef(null);
      const [image, setImage] = useState(null);
      const [imageObj, setImageObj] = useState(null);
      const [textItems, setTextItems] = useState([]);
      const [draggingId, setDraggingId] = useState(null);
      const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
      const [bubbleColor, setBubbleColor] = useState('#ffffff');
      const [bubbleOpacity, setBubbleOpacity] = useState(0.9);
      const [shakeRegenerate, setShakeRegenerate] = useState(false);
      const [dropActive, setDropActive] = useState(false);

      // ---- Image upload ----
      const handleImageUpload = useCallback((file) => {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            setImageObj(img);
            setImage(e.target.result);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }, []);

      const handleDrop = useCallback((e) => {
        e.preventDefault();
        setDropActive(false);
        const file = e.dataTransfer.files[0];
        handleImageUpload(file);
      }, [handleImageUpload]);

      // ---- Add text ----
      const addText = () => {
        setTextItems(prev => [...prev, {
          id: generateId(),
          text: '텍스트를 입력하세요',
          x: 100 + Math.random() * 200,
          y: 100 + Math.random() * 200,
          fontSize: 28,
          color: '#000000',
          bold: true,
          italic: false,
          stroke: true,
          bubbleType: 'none',
        }]);
      };

      const updateTextItem = (updated) => {
        setTextItems(prev => prev.map(t => t.id === updated.id ? updated : t));
      };

      const deleteTextItem = (id) => {
        setTextItems(prev => prev.filter(t => t.id !== id));
      };

      // ---- Canvas mouse/touch drag ----
      const getCanvasPos = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return { x: 0, y: 0 };
        const rect = canvas.getBoundingClientRect();
        const scaleX = CANVAS_W / rect.width;
        const scaleY = CANVAS_H / rect.height;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
        };
      };

      const getTextBounds = (item, ctx) => {
        const fontStr = `${item.italic ? 'italic ' : ''}${item.bold ? 'bold ' : ''}${item.fontSize}px 'Noto Sans KR', sans-serif`;
        ctx.font = fontStr;
        const lines = wrapText(ctx, item.text, 280);
        const lineHeight = item.fontSize * 1.3;
        const maxW = Math.max(...lines.map(l => ctx.measureText(l).width));
        const totalH = lines.length * lineHeight;
        const padX = item.bubbleType !== 'none' ? 28 : 0;
        const padY = item.bubbleType !== 'none' ? 20 : 0;
        return {
          x: item.x - padX - maxW / 2,
          y: item.y - padY - totalH / 2,
          w: maxW + padX * 2,
          h: totalH + padY * 2,
        };
      };

      const handlePointerDown = (e) => {
        e.preventDefault();
        const pos = getCanvasPos(e);
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        // Find which text item was clicked (reverse order for top layer first)
        for (let i = textItems.length - 1; i >= 0; i--) {
          const item = textItems[i];
          const bounds = getTextBounds(item, ctx);
          if (pos.x >= bounds.x && pos.x <= bounds.x + bounds.w &&
              pos.y >= bounds.y && pos.y <= bounds.y + bounds.h) {
            setDraggingId(item.id);
            setDragOffset({ x: pos.x - item.x, y: pos.y - item.y });
            return;
          }
        }
      };

      const handlePointerMove = (e) => {
        if (!draggingId) return;
        e.preventDefault();
        const pos = getCanvasPos(e);
        setTextItems(prev => prev.map(t =>
          t.id === draggingId
            ? { ...t, x: clamp(pos.x - dragOffset.x, 40, CANVAS_W - 40), y: clamp(pos.y - dragOffset.y, 40, CANVAS_H - 40) }
            : t
        ));
      };

      const handlePointerUp = () => {
        setDraggingId(null);
      };

      // ---- Regenerate ----
      const regenerate = () => {
        setShakeRegenerate(true);
        setTimeout(() => setShakeRegenerate(false), 400);

        setTextItems(prev => prev.map(t => ({
          ...t,
          x: 80 + Math.random() * (CANVAS_W - 160),
          y: 80 + Math.random() * (CANVAS_H - 160),
          fontSize: clamp(t.fontSize + Math.round((Math.random() - 0.5) * 16), 16, 60),
          bubbleType: BUBBLE_TYPES[Math.floor(Math.random() * BUBBLE_TYPES.length)].id,
        })));
        setBubbleColor(RANDOM_COLORS[Math.floor(Math.random() * RANDOM_COLORS.length)]);
        setBubbleOpacity(0.7 + Math.random() * 0.3);
      };

      // ---- Download ----
      const downloadCanvas = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const link = document.createElement('a');
        link.download = `짤_${getTimestamp()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      };

      // ---- Canvas rendering ----
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

        // Draw background
        if (imageObj) {
          const imgAspect = imageObj.width / imageObj.height;
          const canvasAspect = CANVAS_W / CANVAS_H;
          let sx = 0, sy = 0, sw = imageObj.width, sh = imageObj.height;
          if (imgAspect > canvasAspect) {
            sw = imageObj.height * canvasAspect;
            sx = (imageObj.width - sw) / 2;
          } else {
            sh = imageObj.width / canvasAspect;
            sy = (imageObj.height - sh) / 2;
          }
          ctx.drawImage(imageObj, sx, sy, sw, sh, 0, 0, CANVAS_W, CANVAS_H);
        } else {
          // Placeholder
          ctx.fillStyle = '#f1f5f9';
          ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
          const grad = ctx.createLinearGradient(0, 0, CANVAS_W, CANVAS_H);
          grad.addColorStop(0, '#e2e8f0');
          grad.addColorStop(1, '#f1f5f9');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
          // Grid dots
          ctx.fillStyle = '#cbd5e1';
          for (let x = 30; x < CANVAS_W; x += 30) {
            for (let y = 30; y < CANVAS_H; y += 30) {
              ctx.beginPath();
              ctx.arc(x, y, 1.5, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          ctx.fillStyle = '#94a3b8';
          ctx.font = '500 18px Noto Sans KR';
          ctx.textAlign = 'center';
          ctx.fillText('이미지를 업로드하세요', CANVAS_W / 2, CANVAS_H / 2 - 10);
          ctx.font = '400 13px Noto Sans KR';
          ctx.fillStyle = '#b0b8c4';
          ctx.fillText('드래그 & 드롭 또는 버튼 클릭', CANVAS_W / 2, CANVAS_H / 2 + 16);
        }

        // Draw text items with bubbles
        textItems.forEach(item => {
          const fontStr = `${item.italic ? 'italic ' : ''}${item.bold ? 'bold ' : ''}${item.fontSize}px 'Noto Sans KR', sans-serif`;
          ctx.font = fontStr;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          const lines = wrapText(ctx, item.text || ' ', 280);
          const lineHeight = item.fontSize * 1.3;
          const maxLineW = Math.max(...lines.map(l => ctx.measureText(l).width));
          const totalH = lines.length * lineHeight;
          const padX = item.bubbleType !== 'none' ? 28 : 0;
          const padY = item.bubbleType !== 'none' ? 20 : 0;

          // Draw bubble
          if (item.bubbleType !== 'none') {
            const bx = item.x - maxLineW / 2 - padX;
            const by = item.y - totalH / 2 - padY;
            const bw = maxLineW + padX * 2;
            const bh = totalH + padY * 2;
            drawBubble(ctx, item.bubbleType, bx, by, bw, bh, bubbleColor, bubbleOpacity);
          }

          // Draw text
          ctx.font = fontStr;
          ctx.textAlign = 'center';
          lines.forEach((line, i) => {
            const ly = item.y - (totalH / 2) + (i + 0.5) * lineHeight;
            if (item.stroke) {
              ctx.strokeStyle = item.color === '#ffffff' || item.color === '#FFFFFF' ? '#000000' : '#ffffff';
              ctx.lineWidth = item.fontSize / 6;
              ctx.lineJoin = 'round';
              ctx.strokeText(line, item.x, ly);
            }
            ctx.fillStyle = item.color;
            ctx.fillText(line, item.x, ly);
          });

          // Draw drag handle hint if selected
          if (draggingId === item.id) {
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = 'rgba(99,102,241,0.6)';
            ctx.lineWidth = 2;
            const bx = item.x - maxLineW / 2 - padX - 4;
            const by2 = item.y - totalH / 2 - padY - 4;
            ctx.strokeRect(bx, by2, maxLineW + padX * 2 + 8, totalH + padY * 2 + 8);
            ctx.setLineDash([]);
          }
        });
      }, [imageObj, textItems, bubbleColor, bubbleOpacity, draggingId]);

      // ---- Render ----
      return (
        <div className="min-h-screen bg-gradient-to-br from-gray-50 via-white to-brand-50">
          {/* Header */}
          <header className="bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-400 to-pink-400 flex items-center justify-center text-white text-lg">
                  짤
                </div>
                <div>
                  <h1 className="text-lg font-bold text-gray-800 leading-tight">짤 생성기</h1>
                  <p className="text-[11px] text-gray-400">Korean Meme Generator</p>
                </div>
              </div>
              <div className="flex gap-2">
                <Button variant="fun" size="md" onClick={downloadCanvas} disabled={!imageObj && textItems.length === 0}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                  다운로드
                </Button>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-7xl mx-auto px-4 py-6">
            <div className="flex flex-col lg:flex-row gap-6">
              {/* Left: Canvas */}
              <div className="flex-1 min-w-0">
                <Card className="p-4">
                  <div className="mb-3 flex items-center justify-between">
                    <span className="text-sm font-semibold text-gray-600">미리보기</span>
                    <span className="text-[11px] text-gray-400">텍스트를 드래그하여 이동</span>
                  </div>
                  <div
                    className={`relative rounded-xl overflow-hidden border-2 border-dashed transition-all ${dropActive ? 'border-brand-400 bg-brand-50/50' : 'border-gray-200'}`}
                    onDragOver={e => { e.preventDefault(); setDropActive(true); }}
                    onDragLeave={() => setDropActive(false)}
                    onDrop={handleDrop}
                  >
                    <canvas
                      ref={canvasRef}
                      width={CANVAS_W}
                      height={CANVAS_H}
                      className="w-full h-auto cursor-grab active:cursor-grabbing"
                      onMouseDown={handlePointerDown}
                      onMouseMove={handlePointerMove}
                      onMouseUp={handlePointerUp}
                      onMouseLeave={handlePointerUp}
                      onTouchStart={handlePointerDown}
                      onTouchMove={handlePointerMove}
                      onTouchEnd={handlePointerUp}
                      style={{ touchAction: 'none' }}
                    />
                    {!imageObj && (
                      <div className="absolute inset-0 flex flex-col items-center justify-center cursor-pointer"
                        onClick={() => fileInputRef.current?.click()}>
                        <div className="w-16 h-16 mb-3 rounded-2xl bg-gray-100 flex items-center justify-center">
                          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="1.5" strokeLinecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                        </div>
                        <p className="text-sm font-medium text-gray-500">클릭하여 이미지 업로드</p>
                        <p className="text-xs text-gray-400 mt-1">PNG, JPG, GIF, WebP 지원</p>
                      </div>
                    )}
                  </div>
                </Card>
              </div>

              {/* Right: Controls */}
              <div className="w-full lg:w-[380px] flex-shrink-0 space-y-4">
                {/* Image Upload */}
                <Card className="p-4">
                  <h3 className="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2">
                    <span className="w-6 h-6 rounded-lg bg-blue-100 text-blue-500 flex items-center justify-center text-xs">1</span>
                    이미지 업로드
                  </h3>
                  <input ref={fileInputRef} type="file" accept="image/png,image/jpeg,image/gif,image/webp" className="hidden"
                    onChange={e => handleImageUpload(e.target.files[0])} />
                  <div className="flex gap-2">
                    <Button variant="secondary" size="md" className="flex-1" onClick={() => fileInputRef.current?.click()}>
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                      파일 선택
                    </Button>
                    {imageObj && (
                      <Button variant="ghost" size="md" onClick={() => { setImage(null); setImageObj(null); }}>
                        초기화
                      </Button>
                    )}
                  </div>
                </Card>

                {/* Text Items */}
                <Card className="p-4">
                  <h3 className="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2">
                    <span className="w-6 h-6 rounded-lg bg-green-100 text-green-500 flex items-center justify-center text-xs">2</span>
                    텍스트 추가
                  </h3>
                  <div className="space-y-2 max-h-[260px] overflow-y-auto pr-1">
                    {textItems.map(item => (
                      <TextItem key={item.id} item={item} onChange={updateTextItem} onDelete={() => deleteTextItem(item.id)} />
                    ))}
                  </div>
                  <Button variant="secondary" size="md" className="w-full mt-2" onClick={addText}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    텍스트 추가
                  </Button>
                </Card>

                {/* Bubble Style */}
                <Card className="p-4">
                  <h3 className="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2">
                    <span className="w-6 h-6 rounded-lg bg-purple-100 text-purple-500 flex items-center justify-center text-xs">3</span>
                    말풍선 스타일
                  </h3>
                  <p className="text-xs text-gray-400 mb-2">각 텍스트마다 말풍선 스타일을 선택하세요</p>
                  {textItems.length > 0 ? (
                    <div className="space-y-3">
                      {textItems.map(item => (
                        <div key={item.id} className="space-y-1">
                          <span className="text-xs font-medium text-gray-500 truncate block">
                            "{item.text.substring(0, 20)}{item.text.length > 20 ? '...' : ''}"
                          </span>
                          <BubbleCarousel selected={item.bubbleType} onSelect={(bt) => updateTextItem({ ...item, bubbleType: bt })} />
                        </div>
                      ))}
                    </div>
                  ) : (
                    <p className="text-xs text-gray-400 text-center py-4">먼저 텍스트를 추가하세요</p>
                  )}
                </Card>

                {/* Bubble Color & Opacity */}
                <Card className="p-4">
                  <h3 className="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2">
                    <span className="w-6 h-6 rounded-lg bg-orange-100 text-orange-500 flex items-center justify-center text-xs">4</span>
                    말풍선 색상
                  </h3>
                  <div className="flex items-center gap-4">
                    <div className="flex items-center gap-2">
                      <span className="text-xs text-gray-500">색상</span>
                      <input type="color" value={bubbleColor} onChange={e => setBubbleColor(e.target.value)}
                        className="w-8 h-8 rounded-lg border border-gray-200 cursor-pointer" />
                    </div>
                    <div className="flex items-center gap-2 flex-1">
                      <span className="text-xs text-gray-500">투명도</span>
                      <input type="range" min="0" max="100" value={Math.round(bubbleOpacity * 100)}
                        onChange={e => setBubbleOpacity(parseInt(e.target.value) / 100)}
                        className="flex-1 h-1 accent-brand-500" />
                      <span className="text-xs text-gray-500 w-8">{Math.round(bubbleOpacity * 100)}%</span>
                    </div>
                  </div>
                  {/* Quick color swatches */}
                  <div className="flex gap-1.5 mt-3">
                    {RANDOM_COLORS.map(c => (
                      <button key={c} onClick={() => setBubbleColor(c)}
                        className={`w-6 h-6 rounded-full border-2 transition-transform hover:scale-110 ${bubbleColor === c ? 'border-brand-400 scale-110' : 'border-gray-200'}`}
                        style={{ backgroundColor: c }} />
                    ))}
                  </div>
                </Card>

                {/* Actions */}
                <div className="flex gap-2">
                  <Button variant="fun" size="lg"
                    className={`flex-1 ${shakeRegenerate ? 'shake' : ''}`}
                    onClick={regenerate}
                    disabled={textItems.length === 0}>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
                    맘에 안들면 재생성
                  </Button>
                </div>
                <Button variant="primary" size="lg" className="w-full" onClick={downloadCanvas}
                  disabled={!imageObj && textItems.length === 0}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                  PNG로 다운로드
                </Button>

                {/* Tips */}
                <div className="bg-brand-50 rounded-xl p-3 border border-brand-100">
                  <p className="text-xs font-semibold text-brand-600 mb-1">사용 팁</p>
                  <ul className="text-[11px] text-brand-500 space-y-0.5">
                    <li>- 이미지를 드래그 앤 드롭으로 업로드할 수 있어요</li>
                    <li>- 캔버스 위의 텍스트를 드래그하여 위치를 조정하세요</li>
                    <li>- "재생성" 버튼으로 랜덤 레이아웃을 시도해보세요</li>
                    <li>- 말풍선은 좌우 화살표로 스크롤할 수 있어요</li>
                  </ul>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
