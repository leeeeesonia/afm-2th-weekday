<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-day 카운터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .pulse-dot { animation: pulse-dot 1s ease-in-out infinite; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useCallback, useMemo } = React;

    // ========================================
    // 유틸리티 함수
    // ========================================
    const STORAGE_KEY = 'dday-counter-items';

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function saveToStorage(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function calcRemaining(targetDate) {
      const now = new Date();
      const target = new Date(targetDate + 'T00:00:00');
      const diff = target.getTime() - now.getTime();

      if (diff <= 0) {
        const pastDiff = Math.abs(diff);
        const days = Math.floor(pastDiff / (1000 * 60 * 60 * 24));
        return { passed: true, days, hours: 0, minutes: 0, seconds: 0, totalMs: diff };
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      return { passed: false, days, hours, minutes, seconds, totalMs: diff };
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const year = d.getFullYear();
      const month = d.getMonth() + 1;
      const day = d.getDate();
      const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
      const weekday = weekdays[d.getDay()];
      return `${year}년 ${month}월 ${day}일 (${weekday})`;
    }

    // ========================================
    // Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', children }) {
      const base = 'font-semibold rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 cursor-pointer';
      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-700 focus:ring-indigo-500 shadow-md hover:shadow-lg',
        secondary: 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50 focus:ring-gray-400',
        danger: 'bg-red-500 text-white hover:bg-red-600 focus:ring-red-400 shadow-md',
        ghost: 'bg-transparent text-gray-500 hover:bg-gray-100 focus:ring-gray-300',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-sm',
        md: 'px-5 py-2.5 text-base',
        lg: 'px-7 py-3 text-lg',
      };
      const disabledStyle = disabled ? 'opacity-50 cursor-not-allowed' : '';

      return (
        <button
          className={`${base} ${variants[variant]} ${sizes[size]} ${disabledStyle} ${className}`}
          onClick={onClick}
          disabled={disabled}
        >
          {children}
        </button>
      );
    }

    function Input({ label, type = 'text', value, onChange, placeholder, error, className = '' }) {
      return (
        <div className={`flex flex-col gap-1.5 ${className}`}>
          {label && <label className="text-sm font-medium text-gray-700">{label}</label>}
          <input
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            className={`w-full px-4 py-2.5 rounded-xl border ${error ? 'border-red-400 focus:ring-red-300' : 'border-gray-300 focus:ring-indigo-300'} focus:outline-none focus:ring-2 focus:border-transparent transition-all text-gray-800`}
          />
          {error && <p className="text-red-500 text-xs">{error}</p>}
        </div>
      );
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm border border-gray-100 p-6 ${className}`}>
          {children}
        </div>
      );
    }

    function TimeBlock({ value, label }) {
      return (
        <div className="flex flex-col items-center">
          <div className="bg-gray-900 text-white rounded-xl w-16 h-16 sm:w-20 sm:h-20 flex items-center justify-center text-2xl sm:text-3xl font-bold tabular-nums shadow-md">
            {String(value).padStart(2, '0')}
          </div>
          <span className="text-xs sm:text-sm text-gray-500 mt-2 font-medium">{label}</span>
        </div>
      );
    }

    function TimeSeparator() {
      return (
        <div className="flex flex-col items-center justify-center gap-1.5 pt-1">
          <div className="w-1.5 h-1.5 bg-gray-400 rounded-full pulse-dot"></div>
          <div className="w-1.5 h-1.5 bg-gray-400 rounded-full pulse-dot"></div>
        </div>
      );
    }

    // ========================================
    // D-day 카드 컴포넌트
    // ========================================
    function DdayCard({ item, onDelete }) {
      const [remaining, setRemaining] = useState(() => calcRemaining(item.date));

      useEffect(() => {
        const timer = setInterval(() => {
          setRemaining(calcRemaining(item.date));
        }, 1000);
        return () => clearInterval(timer);
      }, [item.date]);

      const bgGradient = remaining.passed
        ? 'from-gray-50 to-gray-100 border-gray-200'
        : 'from-indigo-50 to-purple-50 border-indigo-100';

      return (
        <Card className={`fade-in bg-gradient-to-br ${bgGradient} border relative group`}>
          <button
            onClick={() => onDelete(item.id)}
            className="absolute top-3 right-3 w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:text-red-500 hover:bg-red-50 transition-all opacity-0 group-hover:opacity-100 cursor-pointer"
            aria-label="삭제"
          >
            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fillRule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clipRule="evenodd" />
            </svg>
          </button>

          <div className="mb-4">
            <h3 className="text-lg sm:text-xl font-bold text-gray-800 pr-8">{item.name}</h3>
            <p className="text-sm text-gray-500 mt-1">{formatDate(item.date)}</p>
          </div>

          {remaining.passed ? (
            <div className="text-center py-3">
              <span className="text-3xl sm:text-4xl font-extrabold text-gray-600">D+{remaining.days}</span>
              <p className="text-sm text-gray-400 mt-2">이미 지난 날짜입니다</p>
            </div>
          ) : (
            <div>
              <div className="text-center mb-4">
                <span className="text-3xl sm:text-4xl font-extrabold text-indigo-600">D-{remaining.days}</span>
              </div>
              <div className="flex items-start justify-center gap-2 sm:gap-3">
                <TimeBlock value={remaining.hours} label="시간" />
                <TimeSeparator />
                <TimeBlock value={remaining.minutes} label="분" />
                <TimeSeparator />
                <TimeBlock value={remaining.seconds} label="초" />
              </div>
            </div>
          )}
        </Card>
      );
    }

    // ========================================
    // D-day 추가 폼 컴포넌트
    // ========================================
    function AddDdayForm({ onAdd }) {
      const [name, setName] = useState('');
      const [date, setDate] = useState('');
      const [errors, setErrors] = useState({});
      const [isOpen, setIsOpen] = useState(false);

      const todayStr = useMemo(() => {
        const d = new Date();
        return d.toISOString().split('T')[0];
      }, []);

      const handleSubmit = useCallback((e) => {
        e.preventDefault();
        const newErrors = {};
        if (!name.trim()) newErrors.name = '이벤트 이름을 입력해주세요';
        if (!date) newErrors.date = '목표 날짜를 선택해주세요';

        if (Object.keys(newErrors).length > 0) {
          setErrors(newErrors);
          return;
        }

        onAdd({ id: Date.now().toString(), name: name.trim(), date });
        setName('');
        setDate('');
        setErrors({});
        setIsOpen(false);
      }, [name, date, onAdd]);

      if (!isOpen) {
        return (
          <button
            onClick={() => setIsOpen(true)}
            className="w-full border-2 border-dashed border-gray-300 rounded-2xl p-8 text-gray-400 hover:text-indigo-500 hover:border-indigo-400 transition-all duration-200 flex flex-col items-center gap-2 cursor-pointer group"
          >
            <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            <span className="font-medium text-base">새 D-day 추가</span>
          </button>
        );
      }

      return (
        <Card className="fade-in border-2 border-indigo-200">
          <h3 className="text-lg font-bold text-gray-800 mb-4">새 D-day 추가</h3>
          <form onSubmit={handleSubmit} className="flex flex-col gap-4">
            <Input
              label="이벤트 이름"
              value={name}
              onChange={(e) => { setName(e.target.value); setErrors(prev => ({ ...prev, name: undefined })); }}
              placeholder="예: 여름 휴가, 시험일, 생일..."
              error={errors.name}
            />
            <Input
              label="목표 날짜"
              type="date"
              value={date}
              onChange={(e) => { setDate(e.target.value); setErrors(prev => ({ ...prev, date: undefined })); }}
              error={errors.date}
            />
            <div className="flex gap-3 mt-2">
              <Button type="submit" variant="primary" className="flex-1">추가</Button>
              <Button
                variant="secondary"
                onClick={() => { setIsOpen(false); setErrors({}); setName(''); setDate(''); }}
                className="flex-1"
              >
                취소
              </Button>
            </div>
          </form>
        </Card>
      );
    }

    // ========================================
    // 빈 상태 컴포넌트
    // ========================================
    function EmptyState() {
      return (
        <div className="text-center py-16 text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" className="h-16 w-16 mx-auto mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <p className="text-lg font-medium">아직 등록된 D-day가 없습니다</p>
          <p className="text-sm mt-1">아래 버튼을 눌러 첫 번째 D-day를 추가해보세요</p>
        </div>
      );
    }

    // ========================================
    // App 컴포넌트
    // ========================================
    function App() {
      const [items, setItems] = useState(() => loadFromStorage());

      useEffect(() => {
        saveToStorage(items);
      }, [items]);

      const handleAdd = useCallback((newItem) => {
        setItems(prev => [newItem, ...prev]);
      }, []);

      const handleDelete = useCallback((id) => {
        setItems(prev => prev.filter(item => item.id !== id));
      }, []);

      const sortedItems = useMemo(() => {
        return [...items].sort((a, b) => {
          const remainA = calcRemaining(a.date);
          const remainB = calcRemaining(b.date);
          if (remainA.passed !== remainB.passed) return remainA.passed ? 1 : -1;
          return new Date(a.date) - new Date(b.date);
        });
      }, [items]);

      return (
        <div className="max-w-2xl mx-auto px-4 py-8 sm:py-12">
          <header className="text-center mb-10">
            <h1 className="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight">
              D-day 카운터
            </h1>
            <p className="text-gray-500 mt-2 text-sm sm:text-base">
              소중한 날까지 남은 시간을 확인하세요
            </p>
            {items.length > 0 && (
              <p className="text-xs text-gray-400 mt-1">
                총 {items.length}개의 D-day
              </p>
            )}
          </header>

          <div className="flex flex-col gap-5">
            {sortedItems.length === 0 && <EmptyState />}
            {sortedItems.map(item => (
              <DdayCard key={item.id} item={item} onDelete={handleDelete} />
            ))}
            <AddDdayForm onAdd={handleAdd} />
          </div>

          <footer className="text-center text-xs text-gray-300 mt-12">
            1초마다 실시간 업데이트 | localStorage 자동 저장
          </footer>
        </div>
      );
    }

    // ========================================
    // 렌더링
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
