<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>밸런스 게임</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Noto Sans KR"', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    * { font-family: 'Noto Sans KR', sans-serif; }

    @keyframes fillBar {
      from { width: 0%; }
    }

    .bar-animate {
      animation: fillBar 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes countUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .count-animate {
      animation: countUp 0.5s ease-out forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in-up {
      animation: fadeInUp 0.4s ease-out forwards;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.3); }
      50% { box-shadow: 0 0 0 12px rgba(139, 92, 246, 0); }
    }

    .pulse-glow {
      animation: pulse-glow 2s infinite;
    }

    .option-btn {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .option-btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .option-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    @keyframes slideDown {
      from { opacity: 0; max-height: 0; }
      to { opacity: 1; max-height: 600px; }
    }

    .slide-down {
      animation: slideDown 0.35s ease-out forwards;
      overflow: hidden;
    }

    .backdrop-blur-custom {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ========================================
    // Seed Data
    // ========================================

    const CATEGORIES = [
      { id: 'all', label: '전체', emoji: '🎯', color: 'from-violet-500 to-purple-600' },
      { id: 'friend', label: '친구용', emoji: '👫', color: 'from-blue-500 to-cyan-500' },
      { id: 'couple', label: '연인용', emoji: '💕', color: 'from-pink-500 to-rose-500' },
      { id: 'group', label: '단체용', emoji: '🏢', color: 'from-amber-500 to-orange-500' },
    ];

    // ========================================
    // API Base URL
    // ========================================
    const API = '/api';

    // ========================================
    // LocalStorage Helpers
    // ========================================

    function getVoterName() {
      return localStorage.getItem('balance_voter_name') || '';
    }

    function saveVoterName(name) {
      localStorage.setItem('balance_voter_name', name);
    }

    function getVotedQuestions() {
      try {
        return JSON.parse(localStorage.getItem('balance_voted') || '{}');
      } catch {
        return {};
      }
    }

    function setVotedQuestion(questionId, choice) {
      const voted = getVotedQuestions();
      voted[questionId] = choice;
      localStorage.setItem('balance_voted', JSON.stringify(voted));
    }

    function removeVotedQuestion(questionId) {
      const voted = getVotedQuestions();
      delete voted[questionId];
      localStorage.setItem('balance_voted', JSON.stringify(voted));
    }

    // ========================================
    // Category Label Helper
    // ========================================
    const CATEGORY_LABEL = { friend: '친구용', couple: '연인용', group: '단체용' };

    // ========================================
    // Design System Components
    // ========================================

    function Badge({ children, variant = 'default', className = '' }) {
      const variants = {
        default: 'bg-gray-100 text-gray-700',
        friend: 'bg-blue-100 text-blue-700',
        couple: 'bg-pink-100 text-pink-700',
        group: 'bg-amber-100 text-amber-700',
      };
      return (
        <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${variants[variant]} ${className}`}>
          {children}
        </span>
      );
    }

    function Modal({ isOpen, onClose, title, children }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4">
          <div className="fixed inset-0 bg-black/50 backdrop-blur-custom" onClick={onClose} />
          <div className="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg slide-down z-10">
            <div className="flex items-center justify-between p-5 border-b border-gray-100">
              <h3 className="text-lg font-bold text-gray-900">{title}</h3>
              <button
                onClick={onClose}
                className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors text-gray-400 hover:text-gray-600"
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
            <div className="p-5">{children}</div>
          </div>
        </div>
      );
    }

    // ========================================
    // Category Tab Component
    // ========================================

    function CategoryTabs({ activeCategory, onCategoryChange }) {
      return (
        <div className="flex gap-2 overflow-x-auto pb-1 px-1 scrollbar-hide">
          {CATEGORIES.map((cat) => {
            const isActive = activeCategory === cat.id;
            return (
              <button
                key={cat.id}
                onClick={() => onCategoryChange(cat.id)}
                className={`flex-shrink-0 flex items-center gap-1.5 px-4 py-2.5 rounded-full text-sm font-semibold transition-all duration-300 ${
                  isActive
                    ? `bg-gradient-to-r ${cat.color} text-white shadow-lg shadow-purple-500/20 scale-105`
                    : 'bg-white text-gray-600 hover:bg-gray-100 shadow-sm'
                }`}
              >
                <span>{cat.emoji}</span>
                <span>{cat.label}</span>
              </button>
            );
          })}
        </div>
      );
    }

    // ========================================
    // Percentage Bar Component
    // ========================================

    function PercentageBar({ percent, side, isWinner }) {
      const colorA = isWinner ? 'bg-gradient-to-r from-violet-500 to-purple-500' : 'bg-gray-300';
      const colorB = isWinner ? 'bg-gradient-to-l from-rose-500 to-pink-500' : 'bg-gray-300';
      const barColor = side === 'A' ? colorA : colorB;

      return (
        <div className="w-full bg-gray-100 rounded-full h-3 overflow-hidden">
          <div
            className={`h-full rounded-full bar-animate ${barColor}`}
            style={{ width: `${percent}%` }}
          />
        </div>
      );
    }

    // ========================================
    // Question Card Component
    // ========================================

    function QuestionCard({ question, onVote, onCancelVote, onEdit, onDelete, votedChoice }) {
      const { id, category, optionA, optionB, votesA, votesB } = question;
      const hasVoted = votedChoice !== undefined;
      const total = votesA + votesB;
      const percentA = total === 0 ? 50 : Math.round((votesA / total) * 100);
      const percentB = total === 0 ? 50 : 100 - percentA;
      const [showMenu, setShowMenu] = useState(false);
      const menuRef = useRef(null);

      useEffect(() => {
        function handleClick(e) {
          if (menuRef.current && !menuRef.current.contains(e.target)) setShowMenu(false);
        }
        if (showMenu) document.addEventListener('mousedown', handleClick);
        return () => document.removeEventListener('mousedown', handleClick);
      }, [showMenu]);

      const categoryInfo = CATEGORIES.find((c) => c.id === category) || CATEGORIES[3];
      const badgeVariant = category;

      return (
        <div className="bg-white rounded-2xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden fade-in-up border border-gray-100">
          <div className="p-5">
            <div className="flex items-center justify-between mb-4">
              <Badge variant={badgeVariant}>
                {categoryInfo.emoji} {categoryInfo.label}
              </Badge>
              <div className="flex items-center gap-2">
                {hasVoted && (
                  <span className="text-xs text-gray-400 count-animate flex items-center gap-1">
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    {total.toLocaleString()}명 참여
                  </span>
                )}
                <div className="relative" ref={menuRef}>
                  <button
                    onClick={() => setShowMenu(!showMenu)}
                    className="w-7 h-7 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors text-gray-400 hover:text-gray-600"
                  >
                    <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                      <path d="M10 6a2 2 0 110-4 2 2 0 010 4zm0 6a2 2 0 110-4 2 2 0 010 4zm0 6a2 2 0 110-4 2 2 0 010 4z" />
                    </svg>
                  </button>
                  {showMenu && (
                    <div className="absolute right-0 top-8 bg-white rounded-xl shadow-lg border border-gray-100 py-1 z-20 w-32 slide-down">
                      <button
                        onClick={() => { setShowMenu(false); onEdit(question); }}
                        className="w-full px-4 py-2 text-left text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2"
                      >
                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                        수정
                      </button>
                      <button
                        onClick={() => { setShowMenu(false); onDelete(id); }}
                        className="w-full px-4 py-2 text-left text-sm text-red-500 hover:bg-red-50 flex items-center gap-2"
                      >
                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                        삭제
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>

            {!hasVoted ? (
              <div className="flex gap-3">
                <button
                  onClick={() => onVote(id, 'A')}
                  className="option-btn flex-1 relative bg-gradient-to-br from-violet-50 to-purple-50 border-2 border-violet-200 hover:border-violet-400 hover:from-violet-100 hover:to-purple-100 rounded-xl p-4 text-center group"
                >
                  <span className="absolute top-2 left-3 text-xs font-bold text-violet-400 group-hover:text-violet-600">A</span>
                  <p className="text-sm font-semibold text-gray-800 leading-relaxed">{optionA}</p>
                </button>

                <div className="flex items-center">
                  <span className="text-xs font-black text-gray-300 tracking-wider">VS</span>
                </div>

                <button
                  onClick={() => onVote(id, 'B')}
                  className="option-btn flex-1 relative bg-gradient-to-br from-rose-50 to-pink-50 border-2 border-rose-200 hover:border-rose-400 hover:from-rose-100 hover:to-pink-100 rounded-xl p-4 text-center group"
                >
                  <span className="absolute top-2 left-3 text-xs font-bold text-rose-400 group-hover:text-rose-600">B</span>
                  <p className="text-sm font-semibold text-gray-800 leading-relaxed">{optionB}</p>
                </button>
              </div>
            ) : (
              <div className="space-y-3 count-animate">
                <div className={`rounded-xl p-3 ${votedChoice === 'A' ? 'bg-violet-50 ring-2 ring-violet-300' : 'bg-gray-50'}`}>
                  <div className="flex justify-between items-center mb-2">
                    <p className={`text-sm font-semibold ${votedChoice === 'A' ? 'text-violet-700' : 'text-gray-600'}`}>
                      {votedChoice === 'A' && <span className="mr-1">&#10003;</span>}
                      {optionA}
                    </p>
                    <span className={`text-lg font-black ${percentA >= percentB ? 'text-violet-600' : 'text-gray-400'}`}>
                      {percentA}%
                    </span>
                  </div>
                  <PercentageBar percent={percentA} side="A" isWinner={percentA >= percentB} />
                  <p className="text-xs text-gray-400 mt-1">{votesA.toLocaleString()}표</p>
                </div>

                <div className={`rounded-xl p-3 ${votedChoice === 'B' ? 'bg-rose-50 ring-2 ring-rose-300' : 'bg-gray-50'}`}>
                  <div className="flex justify-between items-center mb-2">
                    <p className={`text-sm font-semibold ${votedChoice === 'B' ? 'text-rose-700' : 'text-gray-600'}`}>
                      {votedChoice === 'B' && <span className="mr-1">&#10003;</span>}
                      {optionB}
                    </p>
                    <span className={`text-lg font-black ${percentB > percentA ? 'text-rose-600' : 'text-gray-400'}`}>
                      {percentB}%
                    </span>
                  </div>
                  <PercentageBar percent={percentB} side="B" isWinner={percentB > percentA} />
                  <p className="text-xs text-gray-400 mt-1">{votesB.toLocaleString()}표</p>
                </div>

                <button
                  onClick={() => onCancelVote(id)}
                  className="w-full mt-1 py-2 rounded-lg text-xs font-semibold text-gray-400 hover:text-red-500 hover:bg-red-50 border border-gray-200 hover:border-red-200 transition-all flex items-center justify-center gap-1.5"
                >
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
                  </svg>
                  투표 취소
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========================================
    // Add Question Form Component
    // ========================================

    function AddQuestionForm({ onAdd, onClose }) {
      const [category, setCategory] = useState('friend');
      const [optionA, setOptionA] = useState('');
      const [optionB, setOptionB] = useState('');

      const canSubmit = optionA.trim() && optionB.trim();

      function handleSubmit(e) {
        e.preventDefault();
        if (!canSubmit) return;
        onAdd({
          id: `q-${Date.now()}`,
          category,
          optionA: optionA.trim(),
          optionB: optionB.trim(),
          votesA: 0,
          votesB: 0,
        });
        setOptionA('');
        setOptionB('');
        setCategory('friend');
        onClose();
      }

      const categoryOptions = CATEGORIES.filter((c) => c.id !== 'all');

      return (
        <form onSubmit={handleSubmit} className="space-y-5">
          <div>
            <label className="block text-sm font-semibold text-gray-700 mb-2">카테고리</label>
            <div className="flex gap-2">
              {categoryOptions.map((cat) => (
                <button
                  key={cat.id}
                  type="button"
                  onClick={() => setCategory(cat.id)}
                  className={`flex-1 py-2.5 rounded-xl text-sm font-medium transition-all ${
                    category === cat.id
                      ? `bg-gradient-to-r ${cat.color} text-white shadow-md`
                      : 'bg-gray-100 text-gray-500 hover:bg-gray-200'
                  }`}
                >
                  {cat.emoji} {cat.label}
                </button>
              ))}
            </div>
          </div>

          <div>
            <label className="block text-sm font-semibold text-gray-700 mb-2">선택지 A</label>
            <input
              type="text"
              value={optionA}
              onChange={(e) => setOptionA(e.target.value)}
              placeholder="예: 평생 여름만 살기"
              className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-violet-400 focus:ring-2 focus:ring-violet-100 outline-none transition-all text-sm"
              maxLength={50}
            />
          </div>

          <div className="flex justify-center">
            <span className="text-xs font-black text-gray-300 tracking-widest">VS</span>
          </div>

          <div>
            <label className="block text-sm font-semibold text-gray-700 mb-2">선택지 B</label>
            <input
              type="text"
              value={optionB}
              onChange={(e) => setOptionB(e.target.value)}
              placeholder="예: 평생 겨울만 살기"
              className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-rose-400 focus:ring-2 focus:ring-rose-100 outline-none transition-all text-sm"
              maxLength={50}
            />
          </div>

          <button
            type="submit"
            disabled={!canSubmit}
            className={`w-full py-3.5 rounded-xl text-sm font-bold transition-all ${
              canSubmit
                ? 'bg-gradient-to-r from-violet-500 to-purple-600 text-white shadow-lg shadow-violet-500/30 hover:shadow-violet-500/50 active:scale-[0.98]'
                : 'bg-gray-200 text-gray-400 cursor-not-allowed'
            }`}
          >
            질문 등록하기
          </button>
        </form>
      );
    }

    // ========================================
    // Edit Question Form Component
    // ========================================

    function EditQuestionForm({ question, onSave, onClose }) {
      const [category, setCategory] = useState(question.category);
      const [optionA, setOptionA] = useState(question.optionA);
      const [optionB, setOptionB] = useState(question.optionB);

      const canSubmit = optionA.trim() && optionB.trim();

      function handleSubmit(e) {
        e.preventDefault();
        if (!canSubmit) return;
        onSave({ ...question, category, optionA: optionA.trim(), optionB: optionB.trim() });
        onClose();
      }

      const categoryOptions = CATEGORIES.filter((c) => c.id !== 'all');

      return (
        <form onSubmit={handleSubmit} className="space-y-5">
          <div>
            <label className="block text-sm font-semibold text-gray-700 mb-2">카테고리</label>
            <div className="flex gap-2">
              {categoryOptions.map((cat) => (
                <button
                  key={cat.id}
                  type="button"
                  onClick={() => setCategory(cat.id)}
                  className={`flex-1 py-2.5 rounded-xl text-sm font-medium transition-all ${
                    category === cat.id
                      ? `bg-gradient-to-r ${cat.color} text-white shadow-md`
                      : 'bg-gray-100 text-gray-500 hover:bg-gray-200'
                  }`}
                >
                  {cat.emoji} {cat.label}
                </button>
              ))}
            </div>
          </div>

          <div>
            <label className="block text-sm font-semibold text-gray-700 mb-2">선택지 A</label>
            <input
              type="text"
              value={optionA}
              onChange={(e) => setOptionA(e.target.value)}
              className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-violet-400 focus:ring-2 focus:ring-violet-100 outline-none transition-all text-sm"
              maxLength={50}
            />
          </div>

          <div className="flex justify-center">
            <span className="text-xs font-black text-gray-300 tracking-widest">VS</span>
          </div>

          <div>
            <label className="block text-sm font-semibold text-gray-700 mb-2">선택지 B</label>
            <input
              type="text"
              value={optionB}
              onChange={(e) => setOptionB(e.target.value)}
              className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-rose-400 focus:ring-2 focus:ring-rose-100 outline-none transition-all text-sm"
              maxLength={50}
            />
          </div>

          <button
            type="submit"
            disabled={!canSubmit}
            className={`w-full py-3.5 rounded-xl text-sm font-bold transition-all ${
              canSubmit
                ? 'bg-gradient-to-r from-violet-500 to-purple-600 text-white shadow-lg shadow-violet-500/30 hover:shadow-violet-500/50 active:scale-[0.98]'
                : 'bg-gray-200 text-gray-400 cursor-not-allowed'
            }`}
          >
            수정 완료
          </button>
        </form>
      );
    }

    // ========================================
    // Delete Confirm Component
    // ========================================

    function DeleteConfirm({ question, onConfirm, onClose }) {
      return (
        <div className="text-center space-y-4">
          <div className="w-14 h-14 mx-auto bg-red-100 rounded-full flex items-center justify-center">
            <svg className="w-7 h-7 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </div>
          <p className="text-sm text-gray-600">
            <span className="font-semibold text-gray-800">"{question.optionA} vs {question.optionB}"</span>
            <br />이 질문을 정말 삭제할까요?
          </p>
          <div className="flex gap-3">
            <button
              onClick={onClose}
              className="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors"
            >
              취소
            </button>
            <button
              onClick={() => { onConfirm(question.id); onClose(); }}
              className="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-red-500 text-white hover:bg-red-600 transition-colors"
            >
              삭제
            </button>
          </div>
        </div>
      );
    }

    // ========================================
    // App Component
    // ========================================

    // ========================================
    // Voter Name Prompt Component
    // ========================================

    function VoterNamePrompt({ onSubmit }) {
      const [name, setName] = useState('');
      return (
        <div className="min-h-screen bg-gradient-to-b from-violet-50 via-white to-rose-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm text-center fade-in-up">
            <h1 className="text-2xl font-extrabold bg-gradient-to-r from-violet-600 to-rose-500 bg-clip-text text-transparent mb-2">
              밸런스 게임
            </h1>
            <p className="text-sm text-gray-400 mb-6">참여할 이름을 입력해주세요</p>
            <input
              type="text"
              value={name}
              onChange={(e) => setName(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && name.trim() && onSubmit(name.trim())}
              placeholder="예: 소니아"
              className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-violet-400 focus:ring-2 focus:ring-violet-100 outline-none transition-all text-sm text-center mb-4"
              maxLength={20}
              autoFocus
            />
            <button
              onClick={() => name.trim() && onSubmit(name.trim())}
              disabled={!name.trim()}
              className={`w-full py-3 rounded-xl text-sm font-bold transition-all ${
                name.trim()
                  ? 'bg-gradient-to-r from-violet-500 to-purple-600 text-white shadow-lg shadow-violet-500/30 hover:shadow-violet-500/50 active:scale-[0.98]'
                  : 'bg-gray-200 text-gray-400 cursor-not-allowed'
              }`}
            >
              시작하기
            </button>
          </div>
        </div>
      );
    }

    // ========================================
    // Participants Panel Component
    // ========================================

    function ParticipantsPanel({ participants }) {
      if (!participants || participants.length === 0) return null;
      return (
        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4 fade-in-up">
          <div className="flex items-center gap-2 mb-3">
            <svg className="w-4 h-4 text-violet-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <h3 className="text-sm font-bold text-gray-700">참여자 ({participants.length}명)</h3>
          </div>
          <div className="space-y-2">
            {participants.map((p) => (
              <div key={p.name} className="flex items-center justify-between py-2 px-3 rounded-lg bg-gray-50">
                <div className="flex items-center gap-2">
                  <div className="w-7 h-7 rounded-full bg-gradient-to-r from-violet-400 to-rose-400 flex items-center justify-center text-white text-xs font-bold">
                    {p.name[0]}
                  </div>
                  <span className="text-sm font-semibold text-gray-700">{p.name}</span>
                </div>
                <div className="flex items-center gap-2">
                  <div className="flex gap-1">
                    {p.categories.map((cat) => (
                      <span key={cat} className={`text-[10px] px-1.5 py-0.5 rounded-full font-medium ${
                        cat === 'friend' ? 'bg-blue-100 text-blue-600' :
                        cat === 'couple' ? 'bg-pink-100 text-pink-600' :
                        'bg-amber-100 text-amber-600'
                      }`}>
                        {CATEGORY_LABEL[cat]}
                      </span>
                    ))}
                  </div>
                  <span className="text-xs text-gray-400">{p.voteCount}표</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ========================================
    // App Component
    // ========================================

    function App() {
      const [voterName, setVoterName] = useState(getVoterName);
      const [questions, setQuestions] = useState([]);
      const [participants, setParticipants] = useState([]);
      const [activeCategory, setActiveCategory] = useState('all');
      const [votedMap, setVotedMap] = useState(getVotedQuestions);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingQuestion, setEditingQuestion] = useState(null);
      const [deletingQuestion, setDeletingQuestion] = useState(null);
      const [loading, setLoading] = useState(true);

      // Fetch questions from API
      const fetchQuestions = useCallback(async () => {
        try {
          const res = await fetch(`${API}/questions`);
          const json = await res.json();
          if (json.success) setQuestions(json.data);
        } catch (err) { console.error('Failed to fetch questions', err); }
      }, []);

      // Fetch participants from API
      const fetchParticipants = useCallback(async () => {
        try {
          const res = await fetch(`${API}/participants`);
          const json = await res.json();
          if (json.success) setParticipants(json.data);
        } catch (err) { console.error('Failed to fetch participants', err); }
      }, []);

      // Initial load
      useEffect(() => {
        if (!voterName) return;
        Promise.all([fetchQuestions(), fetchParticipants()]).finally(() => setLoading(false));
      }, [voterName, fetchQuestions, fetchParticipants]);

      const handleSetVoterName = useCallback((name) => {
        saveVoterName(name);
        setVoterName(name);
      }, []);

      const filteredQuestions = useMemo(() => {
        if (activeCategory === 'all') return questions;
        return questions.filter((q) => q.category === activeCategory);
      }, [questions, activeCategory]);

      const handleVote = useCallback(async (questionId, choice) => {
        // Optimistic update
        setQuestions((prev) =>
          prev.map((q) => {
            if (q.id !== questionId) return q;
            const newA = choice === 'A' ? q.votesA + 1 : q.votesA;
            const newB = choice === 'B' ? q.votesB + 1 : q.votesB;
            const total = newA + newB;
            return { ...q, votesA: newA, votesB: newB, totalVotes: total,
              percentA: total === 0 ? 0 : Math.round((newA / total) * 1000) / 10,
              percentB: total === 0 ? 0 : Math.round((newB / total) * 1000) / 10 };
          })
        );
        setVotedMap((prev) => ({ ...prev, [questionId]: choice }));
        setVotedQuestion(questionId, choice);

        try {
          await fetch(`${API}/questions/${questionId}/vote`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ choice, voterName }),
          });
          fetchQuestions();
          fetchParticipants();
        } catch (err) { console.error('Vote failed', err); }
      }, [voterName, fetchQuestions, fetchParticipants]);

      const handleCancelVote = useCallback(async (questionId) => {
        const prevChoice = votedMap[questionId];
        // Optimistic update
        setQuestions((prev) =>
          prev.map((q) => {
            if (q.id !== questionId) return q;
            const newA = prevChoice === 'A' ? Math.max(0, q.votesA - 1) : q.votesA;
            const newB = prevChoice === 'B' ? Math.max(0, q.votesB - 1) : q.votesB;
            const total = newA + newB;
            return { ...q, votesA: newA, votesB: newB, totalVotes: total,
              percentA: total === 0 ? 0 : Math.round((newA / total) * 1000) / 10,
              percentB: total === 0 ? 0 : Math.round((newB / total) * 1000) / 10 };
          })
        );
        setVotedMap((prev) => { const next = { ...prev }; delete next[questionId]; return next; });
        removeVotedQuestion(questionId);

        try {
          await fetch(`${API}/questions/${questionId}/vote`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ voterName }),
          });
          fetchQuestions();
          fetchParticipants();
        } catch (err) { console.error('Cancel vote failed', err); }
      }, [voterName, votedMap, fetchQuestions, fetchParticipants]);

      const handleAddQuestion = useCallback(async (newQ) => {
        try {
          const res = await fetch(`${API}/questions`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ category: newQ.category, optionA: newQ.optionA, optionB: newQ.optionB }),
          });
          const json = await res.json();
          if (json.success) {
            setQuestions((prev) => [json.data, ...prev]);
          }
        } catch (err) { console.error('Add question failed', err); }
      }, []);

      const handleEditQuestion = useCallback(async (updated) => {
        setQuestions((prev) =>
          prev.map((q) => (q.id === updated.id ? { ...q, category: updated.category, optionA: updated.optionA, optionB: updated.optionB } : q))
        );
        try {
          await fetch(`${API}/questions/${updated.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ category: updated.category, optionA: updated.optionA, optionB: updated.optionB }),
          });
          fetchQuestions();
        } catch (err) { console.error('Edit question failed', err); }
      }, [fetchQuestions]);

      const handleDeleteQuestion = useCallback(async (questionId) => {
        setQuestions((prev) => prev.filter((q) => q.id !== questionId));
        removeVotedQuestion(questionId);
        try {
          await fetch(`${API}/questions/${questionId}`, { method: 'DELETE' });
          fetchQuestions();
          fetchParticipants();
        } catch (err) { console.error('Delete question failed', err); }
      }, [fetchQuestions, fetchParticipants]);

      const totalVoters = useMemo(() => {
        return questions.reduce((sum, q) => sum + (q.votesA || 0) + (q.votesB || 0), 0);
      }, [questions]);

      // Name prompt screen
      if (!voterName) {
        return <VoterNamePrompt onSubmit={handleSetVoterName} />;
      }

      return (
        <div className="min-h-screen bg-gradient-to-b from-violet-50 via-white to-rose-50">
          {/* Header */}
          <header className="sticky top-0 z-40 bg-white/80 backdrop-blur-custom border-b border-gray-100">
            <div className="max-w-lg mx-auto px-4 py-4">
              <div className="flex items-center justify-between mb-3">
                <div>
                  <h1 className="text-xl font-extrabold bg-gradient-to-r from-violet-600 to-rose-500 bg-clip-text text-transparent">
                    밸런스 게임
                  </h1>
                  <p className="text-xs text-gray-400 mt-0.5">
                    {questions.length}개 질문 | {totalVoters}표 | <span className="text-violet-500 font-semibold">{voterName}</span>님
                    <button onClick={() => { localStorage.removeItem('balance_voter_name'); setVoterName(''); }} className="ml-1 text-gray-300 hover:text-red-400 transition-colors">(변경)</button>
                  </p>
                </div>
                <button
                  onClick={() => setIsModalOpen(true)}
                  className="w-10 h-10 flex items-center justify-center rounded-full bg-gradient-to-r from-violet-500 to-purple-600 text-white shadow-lg shadow-violet-500/30 hover:shadow-violet-500/50 transition-all active:scale-95 pulse-glow"
                  aria-label="질문 추가"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M12 4v16m8-8H4" />
                  </svg>
                </button>
              </div>
              <CategoryTabs activeCategory={activeCategory} onCategoryChange={setActiveCategory} />
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-lg mx-auto px-4 py-5 pb-24">
            {/* Participants Panel */}
            <ParticipantsPanel participants={participants} />

            {loading ? (
              <div className="text-center py-16">
                <p className="text-gray-400 text-sm">불러오는 중...</p>
              </div>
            ) : filteredQuestions.length === 0 ? (
              <div className="text-center py-16">
                <p className="text-4xl mb-3">&#129300;</p>
                <p className="text-gray-400 text-sm font-medium">아직 이 카테고리에 질문이 없어요</p>
                <button
                  onClick={() => setIsModalOpen(true)}
                  className="mt-4 px-5 py-2 rounded-full bg-violet-100 text-violet-600 text-sm font-semibold hover:bg-violet-200 transition-colors"
                >
                  첫 질문 만들기
                </button>
              </div>
            ) : (
              <div className="space-y-4">
                {filteredQuestions.map((q) => (
                  <QuestionCard
                    key={q.id}
                    question={q}
                    onVote={handleVote}
                    onCancelVote={handleCancelVote}
                    onEdit={(q) => setEditingQuestion(q)}
                    onDelete={(id) => setDeletingQuestion(questions.find(qq => qq.id === id))}
                    votedChoice={votedMap[q.id]}
                  />
                ))}
              </div>
            )}
          </main>

          {/* Floating Add Button (mobile) */}
          <div className="fixed bottom-6 right-6 sm:hidden z-30">
            <button
              onClick={() => setIsModalOpen(true)}
              className="w-14 h-14 flex items-center justify-center rounded-full bg-gradient-to-r from-violet-500 to-purple-600 text-white shadow-xl shadow-violet-500/40 hover:shadow-violet-500/60 transition-all active:scale-90 pulse-glow"
              aria-label="질문 추가"
            >
              <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M12 4v16m8-8H4" />
              </svg>
            </button>
          </div>

          {/* Add Question Modal */}
          <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title="새 질문 만들기">
            <AddQuestionForm onAdd={handleAddQuestion} onClose={() => setIsModalOpen(false)} />
          </Modal>

          {/* Edit Question Modal */}
          <Modal isOpen={!!editingQuestion} onClose={() => setEditingQuestion(null)} title="질문 수정">
            {editingQuestion && (
              <EditQuestionForm
                question={editingQuestion}
                onSave={handleEditQuestion}
                onClose={() => setEditingQuestion(null)}
              />
            )}
          </Modal>

          {/* Delete Confirm Modal */}
          <Modal isOpen={!!deletingQuestion} onClose={() => setDeletingQuestion(null)} title="질문 삭제">
            {deletingQuestion && (
              <DeleteConfirm
                question={deletingQuestion}
                onConfirm={handleDeleteQuestion}
                onClose={() => setDeletingQuestion(null)}
              />
            )}
          </Modal>
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
