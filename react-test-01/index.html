<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.5s ease forwards; opacity: 0; }

    @keyframes expand {
      from { transform: scaleY(0); opacity: 0; }
      to { transform: scaleY(1); opacity: 1; }
    }
    .bar-grow { animation: expand 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; transform-origin: bottom; opacity: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useCallback, useRef, useEffect } = React;

    // ========================================
    // Color Utility Functions
    // ========================================
    function hexToHSL(hex) {
      let r = parseInt(hex.slice(1, 3), 16) / 255;
      let g = parseInt(hex.slice(3, 5), 16) / 255;
      let b = parseInt(hex.slice(5, 7), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;
      if (max === min) { h = s = 0; }
      else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
          case g: h = ((b - r) / d + 2) / 6; break;
          case b: h = ((r - g) / d + 4) / 6; break;
        }
      }
      return { h: h * 360, s: s * 100, l: l * 100 };
    }

    function hslToHex(h, s, l) {
      h = ((h % 360) + 360) % 360;
      s = Math.max(0, Math.min(100, s)) / 100;
      l = Math.max(0, Math.min(100, l)) / 100;
      const a = s * Math.min(l, 1 - l);
      const f = (n) => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    }

    function generatePalette(hex) {
      const { h, s, l } = hexToHSL(hex);
      const rand = () => (Math.random() - 0.5);
      const hueShift = () => rand() * 30;
      const satShift = () => rand() * 15;

      const lightnesses = [
        8  + Math.random() * 7,
        22 + Math.random() * 8,
        40 + Math.random() * 10,
        62 + Math.random() * 10,
        85 + Math.random() * 10,
      ];

      return lightnesses.map((targetL) => {
        const newH = h + hueShift();
        const newS = Math.max(5, Math.min(95, s + satShift()));
        const color = hslToHex(newH, newS, targetL);
        return color.toUpperCase();
      });
    }

    function isValidHex(val) {
      return /^#?[0-9A-Fa-f]{6}$/.test(val);
    }

    function normalizeHex(val) {
      const clean = val.startsWith('#') ? val : `#${val}`;
      return clean.toUpperCase();
    }

    function getContrastColor(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return lum > 0.55 ? '#000000' : '#FFFFFF';
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================
    const RetryButton = ({ onClick }) => (
      <button
        onClick={onClick}
        className="flex items-center gap-2 px-4 py-2 rounded-full border border-white/15 text-sm text-white/70 hover:text-white hover:border-white/30 hover:bg-white/5 transition-all duration-200 active:scale-95"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M1 4v6h6" /><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
        </svg>
        Retry
      </button>
    );

    const CopyButton = ({ text }) => {
      const [copied, setCopied] = useState(false);
      const handleCopy = () => {
        navigator.clipboard.writeText(text).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 1200);
        });
      };
      return (
        <button
          onClick={handleCopy}
          className="ml-2 text-[11px] opacity-0 group-hover:opacity-100 transition-opacity duration-200 hover:underline"
        >
          {copied ? 'Copied!' : 'Copy'}
        </button>
      );
    };

    // ========================================
    // 📄 Color Card Component
    // ========================================
    const ColorCard = ({ hex, index }) => {
      const contrast = getContrastColor(hex);
      const labels = ['Darkest', 'Dark', 'Base', 'Light', 'Lightest'];
      return (
        <div
          className="bar-grow group relative flex-1 min-h-[140px] md:min-h-[240px] rounded-2xl flex flex-col items-center justify-end p-4 cursor-pointer transition-transform duration-300 hover:scale-[1.03] hover:z-10"
          style={{ backgroundColor: hex, animationDelay: `${index * 0.08}s` }}
          onClick={() => navigator.clipboard.writeText(hex)}
          title="클릭하여 복사"
        >
          <span className="text-[10px] uppercase tracking-widest font-medium mb-1 opacity-60" style={{ color: contrast }}>
            {labels[index]}
          </span>
          <span className="text-sm md:text-base font-mono font-semibold flex items-center" style={{ color: contrast }}>
            {hex}
            <CopyButton text={hex} />
          </span>
        </div>
      );
    };

    // ========================================
    // 📄 Palette Result View
    // ========================================
    const PaletteResult = ({ baseHex, palette, onRetry, onReset }) => (
      <div className="min-h-screen flex flex-col">
        {/* Top bar */}
        <div className="flex items-center justify-between px-6 py-4">
          <button
            onClick={onReset}
            className="flex items-center gap-2 text-sm text-white/50 hover:text-white transition-colors"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M15 18l-6-6 6-6" />
            </svg>
            새로운 컬러
          </button>
          <RetryButton onClick={onRetry} />
        </div>

        {/* Base color indicator */}
        <div className="flex items-center justify-center gap-3 mb-8 fade-up" style={{ animationDelay: '0.05s' }}>
          <div className="w-5 h-5 rounded-full border border-white/20" style={{ backgroundColor: baseHex }} />
          <span className="text-sm text-white/50">
            기준 컬러 <span className="font-mono text-white/80">{baseHex}</span> 에 어울리는 팔레트
          </span>
        </div>

        {/* Palette cards */}
        <div className="flex-1 flex items-end px-4 md:px-10 pb-24">
          <div className="w-full max-w-4xl mx-auto flex gap-3 md:gap-4">
            {palette.map((hex, i) => (
              <ColorCard key={`${hex}-${i}`} hex={hex} index={i} />
            ))}
          </div>
        </div>

        {/* Hint */}
        <div className="text-center pb-6">
          <p className="text-[11px] text-white/25">카드를 클릭하면 헥스코드가 복사됩니다</p>
        </div>
      </div>
    );

    // ========================================
    // 📄 Home / Search View
    // ========================================
    const HomeView = ({ onSubmit }) => {
      const [value, setValue] = useState('');
      const [error, setError] = useState('');
      const inputRef = useRef(null);

      useEffect(() => { inputRef.current?.focus(); }, []);

      const handleSubmit = (e) => {
        e.preventDefault();
        const trimmed = value.trim();
        if (!trimmed) { setError('헥스코드를 입력하세요'); return; }
        if (!isValidHex(trimmed)) { setError('올바른 헥스코드를 입력하세요 (예: #FF5733)'); return; }
        setError('');
        onSubmit(normalizeHex(trimmed));
      };

      const handleChange = (e) => {
        setValue(e.target.value);
        if (error) setError('');
      };

      const preview = isValidHex(value.trim()) ? normalizeHex(value.trim()) : null;

      return (
        <div className="min-h-screen flex flex-col items-center justify-center px-6">
          <div className="w-full max-w-md text-center">
            {/* Title */}
            <h1 className="text-3xl md:text-4xl font-bold tracking-tight mb-2 fade-up">
              Color Palette
            </h1>
            <p className="text-sm text-white/40 mb-10 fade-up" style={{ animationDelay: '0.1s' }}>
              헥스코드를 입력하면 어울리는 팔레트를 만들어 드립니다
            </p>

            {/* Search input */}
            <form onSubmit={handleSubmit} className="fade-up" style={{ animationDelay: '0.2s' }}>
              <div className="relative">
                {/* Color preview dot */}
                <div className="absolute left-4 top-1/2 -translate-y-1/2">
                  <div
                    className="w-5 h-5 rounded-full border transition-colors duration-300"
                    style={{
                      backgroundColor: preview || '#333',
                      borderColor: preview ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.1)',
                    }}
                  />
                </div>

                <input
                  ref={inputRef}
                  type="text"
                  value={value}
                  onChange={handleChange}
                  placeholder="#FF5733"
                  maxLength={7}
                  spellCheck={false}
                  className="w-full h-14 pl-12 pr-24 rounded-2xl bg-white/[0.06] border border-white/10 text-white text-lg font-mono placeholder-white/20 outline-none focus:border-white/25 focus:bg-white/[0.08] transition-all duration-300"
                />

                <button
                  type="submit"
                  className="absolute right-2 top-1/2 -translate-y-1/2 px-5 py-2 rounded-xl bg-white text-black text-sm font-semibold hover:bg-white/90 active:scale-95 transition-all duration-200"
                >
                  생성
                </button>
              </div>

              {error && (
                <p className="mt-3 text-sm text-red-400">{error}</p>
              )}
            </form>

            {/* Quick samples */}
            <div className="mt-8 flex flex-wrap items-center justify-center gap-2 fade-up" style={{ animationDelay: '0.35s' }}>
              {['#FF5733', '#3498DB', '#2ECC71', '#9B59B6', '#F39C12', '#1ABC9C'].map((c) => (
                <button
                  key={c}
                  onClick={() => { setValue(c); onSubmit(c); }}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/[0.04] border border-white/[0.06] text-xs text-white/40 hover:text-white/70 hover:border-white/15 transition-all duration-200"
                >
                  <span className="w-3 h-3 rounded-full" style={{ backgroundColor: c }} />
                  <span className="font-mono">{c}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // ========================================
    // 🚀 App Component
    // ========================================
    const App = () => {
      const [baseHex, setBaseHex] = useState(null);
      const [palette, setPalette] = useState([]);

      const handleGenerate = useCallback((hex) => {
        setBaseHex(hex);
        setPalette(generatePalette(hex));
      }, []);

      const handleRetry = useCallback(() => {
        if (baseHex) setPalette(generatePalette(baseHex));
      }, [baseHex]);

      const handleReset = useCallback(() => {
        setBaseHex(null);
        setPalette([]);
      }, []);

      if (!baseHex) {
        return <HomeView onSubmit={handleGenerate} />;
      }

      return (
        <PaletteResult
          baseHex={baseHex}
          palette={palette}
          onRetry={handleRetry}
          onReset={handleReset}
        />
      );
    };

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
